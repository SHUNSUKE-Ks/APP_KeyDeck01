  if (PLAN_INFO[saved.plan]) S.plan = saved.plan;
  if (saved.theme === 'light') document.documentElement.dataset.theme = 'light';
} catch (e) { /* 保存できない環境でも動く */ }
function remember() {
  try { localStorage.setItem('keydeck-editor-view', JSON.stringify({ plan: S.plan, theme: document.documentElement.dataset.theme })); } catch (e) {}
}

/* ---------- 小道具 ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'style') el.style.cssText = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) {
    if (c == null || c === false) continue;
    el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return el;
}
const SVGNS = 'http://www.w3.org/2000/svg';
function s(tag, attrs) {
  const el = document.createElementNS(SVGNS, tag);
  for (const [k, v] of Object.entries(attrs || {})) el.setAttribute(k, v);
  return el;
}
const clone = v => v == null ? v : JSON.parse(JSON.stringify(v));
const trunc = (t, n) => t.length > n ? t.slice(0, n - 1) + '…' : t;

/* ---------- データの読み方 ---------- */
const curSet = () => D.sets.find(x => x.id === S.setId);
const modOn = () => S.modLatch || S.modHeld;
const layerNow = () => modOn() ? 'mod' : 'base';
function hasMod(id) {
  const m = curSet().mod;
  return !!m && Object.prototype.hasOwnProperty.call(m, id);
}
// 今見えている割り当て（修飾中なら修飾の上書き、なければ通常へ透過）
function eff(id) {
  const st = curSet();
  if (modOn() && hasMod(id)) return st.mod[id];
  return st.base[id] ?? null;
}
function slotOf(a, id, slot) {
  if (!a) return null;
  return PARTS[id].kind === 'dial' ? (a[slot] ?? null) : a;
}
function isEmpty(id) {
  const a = eff(id);
  if (PARTS[id].kind === 'dial') return !a || (!a.ccw && !a.cw);
  return !a;
}
function setName(to) {
  if (to === 'next') return '次のセット';
  if (to === 'prev') return '前のセット';
  return D.sets.find(x => x.id === to)?.name ?? to;
}
function setHue(to) {
  if (to === 'next' || to === 'prev') return null;
  return D.sets.find(x => x.id === to)?.hue ?? null;
}
function layerName(id) { return D.layers.find(l => l.id === id)?.name ?? id; }

function actionView(action) {
  const w = h('span', { class: 'act' });
  if (!action) return w;
  if (action.t === 'chord') {
    const keys = action.keys || [];
    if (!keys.length) w.append(h('span', { class: 'act-none' }, 'キー未設定'));
    keys.forEach((k, i) => {
      if (i) w.append(h('span', { class: 'kc-plus' }, '+'));
      w.append(h('kbd', { class: 'kc' }, k));
    });
  } else if (action.t === 'text') {
    w.append(h('span', { class: 'chip chip-text' }, 'あ', '「' + trunc(action.text || '', 12) + '」'));
  } else if (action.t === 'mo') {
    w.append(h('span', { class: 'chip chip-mo' }, '⇧ 押す間 ' + layerName(action.layer)));
  } else if (action.t === 'set') {
    const hue = setHue(action.to);
    w.append(h('span', { class: 'chip chip-set' },
      h('i', { class: 'set-dot', style: hue == null ? 'background:var(--text-3)' : `background:hsl(${hue} 80% 60%)` }),
      '→ ' + setName(action.to)));
  }
  return w;
}

/* ---------- 描き直しの仕組み ----------
   組み立ては案を切り替えたときだけ。以降は bind した関数が
   文字・class を書き換える（要素を作り直さないので、押した感触のアニメが途切れない） */
let binders = [];
let lineDrawer = null;
let cleanups = [];
function bind(fn) { binders.push(fn); fn(); }

function paint() {
  const st = curSet();
  document.documentElement.style.setProperty('--hue', st.hue);
  document.body.classList.toggle('mod-on', modOn());
  binders.forEach(f => f());
  paintTop();
  if (lineDrawer) lineDrawer();
}

function swapAnim() {
  const stage = $('#stage');
  stage.classList.remove('swap');
  void stage.offsetWidth;
  stage.classList.add('swap');
}

function flash(key) {
  $$(`[data-flash~="${key}"]`).forEach(n => {
    n.classList.remove('flash');
    void n.offsetWidth;
    n.classList.add('flash');
  });
}

/* ---------- 音（任意・既定は切） ---------- */
const audio = {
  ctx: null,
  ready() {
    if (!S.sound) return null;
    if (!this.ctx) {
      try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; }
    }
    if (this.ctx.state === 'suspended') this.ctx.resume();
    return this.ctx;
  },
  blip(freq, len, vol) {
    const c = this.ready();
    if (!c) return;
    const o = c.createOscillator(), g = c.createGain(), t = c.currentTime;
    o.type = 'square'; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.002);
    g.gain.exponentialRampToValueAtTime(0.0001, t + len);
    o.connect(g).connect(c.destination);
    o.start(t); o.stop(t + len + 0.01);
  },
  tick(dir) { this.blip(dir === 'cw' ? 2300 : 1900, 0.025, 0.05); },
  press() { this.blip(900, 0.03, 0.04); }
};

/* ---------- 選ぶ ---------- */
function select(id, slot) {
  S.sel = id;
  if (slot) S.slot = slot;
  paint();
  renderEditor();
}
function deselect() {
  if (!S.sel) return;
  S.sel = null;
  paint();
  renderEditor();
}

/* ---------- 押す ---------- */
function ripple(el, e) {
  const r = el.getBoundingClientRect();
  const size = Math.max(r.width, r.height) * 1.4;
  const x = (e.clientX ?? r.left + r.width / 2) - r.left - size / 2;
  const y = (e.clientY ?? r.top + r.height / 2) - r.top - size / 2;
  const sp = h('span', { class: 'ripple', style: `width:${size}px;height:${size}px;left:${x}px;top:${y}px` });
  sp.addEventListener('animationend', () => sp.remove());
  el.append(sp);
}

// 押せる要素にする。修飾キーは「押している間だけ修飾中」を見せる（短く押したら選択）
function attachPress(el, id, opt = {}) {
  el.classList.add('pressable');
  el.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    e.preventDefault();
    try { el.setPointerCapture(e.pointerId); } catch (err) {}
    el.classList.add('is-pressed');
    ripple(el, e);
    audio.press();
    flash(id);
    const isMod = PARTS[id].kind === 'mod';
    const t0 = performance.now();
    if (isMod) { S.modHeld = true; paint(); renderEditor(); }
    else select(id, opt.slot);
    let done = false;
    const end = () => {
      if (done) return;
      done = true;
      el.classList.remove('is-pressed');
      el.removeEventListener('pointerup', end);
      el.removeEventListener('pointercancel', end);
      el.removeEventListener('lostpointercapture', end);
      if (isMod) {
        S.modHeld = false;
        if (performance.now() - t0 < 280) S.sel = id;   // 短く押した = 修飾キー自体を選んだ
        paint(); renderEditor();
      }
    };
    el.addEventListener('pointerup', end);
    el.addEventListener('pointercancel', end);
    el.addEventListener('lostpointercapture', end);
  });
  el.addEventListener('keydown', e => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    e.preventDefault();
    el.classList.add('is-pressed');
    setTimeout(() => el.classList.remove('is-pressed'), 120);
    select(id, opt.slot);
  });
  if (!el.hasAttribute('tabindex')) el.setAttribute('tabindex', '0');
  el.setAttribute('role', 'button');
}

// 状態の class をつける（通常／選択中／修飾中／空き／修飾で変わる）
function partState(el, id) {
  el.classList.add('st');
  bind(() => {
    el.classList.toggle('is-selected', S.sel === id);
    el.classList.toggle('is-empty', isEmpty(id));
    el.classList.toggle('has-mod', hasMod(id));
    el.classList.toggle('is-mod', modOn() && hasMod(id));
    if (PARTS[id].kind === 'mod') el.classList.toggle('is-held', modOn());
  });
}

// 表示名（空きなら「空き」）
function lbl(id, slot) {
  const sp = h('span', { class: 'lbl-anim' });
  bind(() => {
    const a = slotOf(eff(id), id, slot);
    sp.textContent = a ? (a.label || '名前なし') : '空き';
    sp.classList.toggle('is-empty', !a);
  });
  return sp;
}
function actBox(id, slot) {
  const box = h('span', { class: 'lbl-anim' });
  let last;
  bind(() => {
    const action = slotOf(eff(id), id, slot)?.action;
    const sig = JSON.stringify(action ?? null);
    if (sig === last) return;   // 変わっていなければ作り直さない
    last = sig;
    box.replaceChildren(actionView(action));
  });
  return box;
}
// 修飾していないとき「修飾: ○○」を添える
function modLine(id, slot) {
  const el = h('div', { class: 'modline' });
  bind(() => {
    const show = !modOn() && hasMod(id);
    el.hidden = !show;
    if (!show) return;
    const a = slotOf(curSet().mod[id], id, slot);
    el.textContent = '修飾: ' + (a ? (a.label || '名前なし') : '空き');
  });
  return el;
}

/* ---------- ダイヤル ---------- */
function setKnob(id, extra = 0) {
  $$(`[data-knob="${id}"]`).forEach(k => { k.style.transform = `rotate(${(S.dialAngle[id] || 0) + extra}deg)`; });
}
const readoutState = {};
function tick(id, dir) {
  const part = PARTS[id];
  const step = part.detent || 15;
  S.dialAngle[id] = (S.dialAngle[id] || 0) + (dir === 'cw' ? step : -step);
  setKnob(id);
  flash(`${id}.${dir}`);
  audio.tick(dir);
  const rs = readoutState[id] || (readoutState[id] = { dir: null, n: 0, timer: 0 });
  if (rs.dir !== dir) { rs.dir = dir; rs.n = 0; }
  rs.n++;
  const a = slotOf(eff(id), id, dir);
  $$(`[data-readout="${id}"]`).forEach(r => {
    r.textContent = `${dir === 'cw' ? '⟳' : '⟲'} ${a ? (a.label || '名前なし') : '空き'}${rs.n > 1 ? ' ×' + rs.n : ''}`;
    r.classList.add('show');
  });
  clearTimeout(rs.timer);
  rs.timer = setTimeout(() => {
    $$(`[data-readout="${id}"]`).forEach(r => r.classList.remove('show'));
    rs.n = 0; rs.dir = null;
  }, 900);
  // 回した向きの割り当てを編集パネルに出す
  if (S.sel === id && S.slot !== dir) { S.slot = dir; paint(); renderEditor(); }
}

function attachDial(el, id) {
  const step = PARTS[id].detent || 15;
  el.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    e.preventDefault();
    try { el.setPointerCapture(e.pointerId); } catch (err) {}
    const r = el.getBoundingClientRect();
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    const ang = ev => Math.atan2(ev.clientY - cy, ev.clientX - cx) * 180 / Math.PI;
    let last = ang(e), acc = 0;
    el.classList.add('is-grabbed');
    if (S.sel !== id) select(id);
    const move = ev => {
      const a = ang(ev);
      let d = a - last;
      if (d > 180) d -= 360;
      if (d < -180) d += 360;
      last = a;
      acc += d;
      while (acc >= step) { acc -= step; tick(id, 'cw'); }
      while (acc <= -step) { acc += step; tick(id, 'ccw'); }
      setKnob(id, acc * 0.4);   // 目盛りの間は少し遅れてついてくる（ひっかかりの手ごたえ）
    };
    const end = () => {
      el.classList.remove('is-grabbed');
      setKnob(id);
      el.removeEventListener('pointermove', move);
      el.removeEventListener('pointerup', end);
      el.removeEventListener('pointercancel', end);
    };
    el.addEventListener('pointermove', move);
    el.addEventListener('pointerup', end);
    el.addEventListener('pointercancel', end);
  });
  let wacc = 0;
  el.addEventListener('wheel', e => {
    e.preventDefault();
    if (S.sel !== id) select(id);
    wacc += e.deltaY;
    while (wacc >= 40) { wacc -= 40; tick(id, 'cw'); }
    while (wacc <= -40) { wacc += 40; tick(id, 'ccw'); }
  }, { passive: false });
  el.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === 'ArrowUp') { e.preventDefault(); if (S.sel !== id) select(id); tick(id, 'cw'); }
    if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') { e.preventDefault(); if (S.sel !== id) select(id); tick(id, 'ccw'); }
    if (e.key === 'Enter') select(id);
  });
}

function makeDial(part, mode) {
  const el = h('div', {
    class: `dial dial-${part.size || 'L'}${mode === 'mini' ? ' mini' : ''}`,
    tabindex: 0, role: 'slider', 'aria-label': part.name + '（左右キーで回す）', 'data-part': part.id
  });
  el.append(h('div', { class: 'dial-ticks' }));
  const knob = h('div', { class: 'knob', 'data-knob': part.id });
  el.append(knob);
  if (mode === 'guide') el.append(h('span', { class: 'p-id' }, part.id));
  if (mode === 'live') {
    el.append(h('div', { class: 'dial-face' },
      h('span', { class: 'df df-ccw', 'data-flash': part.id + '.ccw' }, h('b', {}, '⟲ 左'), lbl(part.id, 'ccw')),
      h('span', { class: 'df df-cw', 'data-flash': part.id + '.cw' }, h('b', {}, '右 ⟳'), lbl(part.id, 'cw'))));
  }
  el.append(h('div', { class: 'dial-readout', 'data-readout': part.id }));
  attachDial(el, part.id);
  if (mode !== 'mini') partState(el, part.id);
  requestAnimationFrame(() => setKnob(part.id));
  return el;
}

/* ---------- 機器の絵（A と C） ---------- */
function place(el, x, y, w, hh) {
  const W = D.device.width, H = D.device.height;
  el.style.left = (x / W * 100) + '%';
  el.style.top = (y / H * 100) + '%';
  el.style.width = (w / W * 100) + '%';
  el.style.height = (hh / H * 100) + '%';
}

function buildDevice(mode) {
  const dev = h('div', { class: 'device device-' + mode });
  dev.append(h('div', { class: 'device-body' }));
  // 今のセットを示す小さな目盛り
  const strip = h('div', { class: 'set-strip' });
  const bars = D.sets.map(() => h('i'));
  const nm = h('span', { class: 'lbl-anim' });
  strip.append(...bars, nm);
  bind(() => {
    D.sets.forEach((x, i) => bars[i].classList.toggle('on', x.id === S.setId));
    nm.textContent = curSet().name + (modOn() ? ' ・ 修飾中' : '');
  });
  dev.append(strip);

  for (const p of D.device.parts) {
    if (p.group) continue;
    if (p.kind === 'dial') {
      const d = makeDial(p, mode);
      place(d, p.cx - p.d / 2, p.cy - p.d / 2, p.d, p.d);
      dev.append(d);
      continue;
    }
    const el = h('div', { class: `part k-${p.kind}`, 'data-part': p.id, 'aria-label': p.name });
    place(el, p.x, p.y, p.w, p.h);
    if (mode === 'guide') {
      el.append(h('span', { class: 'p-id' }, p.id), h('span', { class: 'p-glyph' }, KIND_ICON[p.kind]));
    } else {
      el.append(h('span', { class: 'p-id' }, p.id));
      const live = h('div', { class: 'p-live' }, h('span', { class: 'p-lbl' }, lbl(p.id)));
      if (p.kind === 'btnL' || p.kind === 'mod') {
        live.append(h('span', { class: 'p-act' }, actBox(p.id)));
        const sub = h('span', { class: 'p-sub' });
        bind(() => {
          const show = !modOn() && hasMod(p.id);
          sub.hidden = !show;
          if (show) { const a = curSet().mod[p.id]; sub.textContent = '修飾: ' + (a ? a.label : '空き'); }
        });
        live.append(sub);
      }
      el.append(live);
    }
    attachPress(el, p.id);
    partState(el, p.id);
    dev.append(el);
  }

  for (const [gid, g] of Object.entries(D.device.groups)) {
    const wrap = h('div', { class: 'dpad', 'data-group': gid });
    place(wrap, g.cx - g.size / 2, g.cy - g.size / 2, g.size, g.size);
    wrap.append(h('div', { class: 'dpad-hub' }));
    for (const p of D.device.parts.filter(x => x.group === gid)) {
      const a = ARM[p.dir];
      const el = h('div', { class: `part k-dpad arm-${p.dir}`, 'data-part': p.id, 'aria-label': p.name,
        style: `left:${a.x * 100}%;top:${a.y * 100}%;width:${a.w * 100}%;height:${a.h * 100}%` });
      el.append(h('span', { class: 'p-glyph' }, DIR_GLYPH[p.dir]));
      if (mode === 'live') el.append(h('span', { class: 'p-lbl' }, lbl(p.id)));
      attachPress(el, p.id);
      partState(el, p.id);
      wrap.append(el);
    }
    dev.append(wrap);
  }
  return dev;
}

/* ---------- 編集パネル右上の小さな地図 ---------- */
function minimap(selId) {
  const W = D.device.width, H = D.device.height;
  const svg = s('svg', { class: 'minimap', viewBox: `-2 -2 ${W + 4} ${H + 4}` });
  svg.append(s('rect', { class: 'mm-body', x: 0, y: 0, width: W, height: H, rx: 6 }));
  const cls = id => 'mm-p' + (id === selId ? ' sel' : (modOn() && hasMod(id) ? ' mod' : ''));
  for (const p of D.device.parts) {
    let el;
    if (p.kind === 'dial') el = s('circle', { cx: p.cx, cy: p.cy, r: p.d / 2 });
    else if (p.group) {
      const g = D.device.groups[p.group], a = ARM[p.dir];
      el = s('rect', { x: g.cx - g.size / 2 + a.x * g.size, y: g.cy - g.size / 2 + a.y * g.size, width: a.w * g.size, height: a.h * g.size, rx: 1.5 });
    } else el = s('rect', { x: p.x, y: p.y, width: p.w, height: p.h, rx: 2 });
    el.setAttribute('class', cls(p.id));
    el.addEventListener('pointerdown', e => { e.preventDefault(); select(p.id); });
    svg.append(el);
  }
  return svg;
}

/* =====================================================================
   A案: 機器の絵＋引き出し線
   ===================================================================== */
function calloutItems() {
  const items = [];
  const groups = {};
  for (const p of D.device.parts) {
    if (p.group) {
      if (!groups[p.group]) {
        const g = D.device.groups[p.group];
        groups[p.group] = { id: p.group, type: 'group', name: g.name, cx: g.cx, cy: g.cy, members: [] };
        items.push(groups[p.group]);
      }
      groups[p.group].members.push(p);
    } else if (p.kind === 'dial') {
      items.push({ id: p.id, type: 'dial', part: p, cx: p.cx, cy: p.cy });
    } else {
      items.push({ id: p.id, type: 'single', part: p, cx: p.x + p.w / 2, cy: p.y + p.h / 2 });
    }
  }
  const mid = D.device.width / 2;
  items.forEach(it => { it.side = it.cx < mid ? 'L' : 'R'; });
  // 片側に偏ったら、中央に近いものから反対側へ回す
  for (;;) {
    const L = items.filter(i => i.side === 'L'), R = items.filter(i => i.side === 'R');
    if (Math.abs(L.length - R.length) <= 1) break;
    const from = L.length > R.length ? L : R;
    from.sort((a, b) => Math.abs(a.cx - mid) - Math.abs(b.cx - mid))[0].side = from === L ? 'R' : 'L';
  }
  items.sort((a, b) => a.cy - b.cy || a.cx - b.cx);
  return items;
}

function buildCallout(it) {
  if (it.type === 'single') {
    const p = it.part;
    const c = h('div', { class: 'callout', 'data-item': it.id, 'data-flash': p.id },
      h('div', { class: 'co-head' }, KIND_ICON[p.kind], ' ', p.name, h('span', { class: 'pid' }, p.id)),
      h('div', { class: 'co-main' }, h('div', { class: 'co-lbl' }, lbl(p.id)), actBox(p.id)),
      modLine(p.id));
    attachPress(c, p.id);
    partState(c, p.id);
    return c;
  }
  if (it.type === 'dial') {
    const p = it.part;
    const head = h('div', { class: 'co-head' }, KIND_ICON.dial, ' ', p.name, h('span', { class: 'pid' }, p.id));
    const c = h('div', { class: 'callout', 'data-item': it.id }, head);
    for (const slot of ['ccw', 'cw']) {
      const row = h('div', { class: 'co-row', 'data-flash': `${p.id}.${slot}` },
        h('span', { class: 'ic' }, slot === 'ccw' ? '⟲' : '⟳'), lbl(p.id, slot), actBox(p.id, slot));
      attachPress(row, p.id, { slot });
      bind(() => {
        const a = slotOf(eff(p.id), p.id, slot);
        row.classList.toggle('is-selected', S.sel === p.id && S.slot === slot);
        row.classList.toggle('is-empty', !a);
        row.classList.toggle('is-mod', modOn() && hasMod(p.id));
      });
      c.append(row);
    }
    bind(() => {
      c.classList.toggle('has-sel', S.sel === p.id);
      c.classList.toggle('is-mod', modOn() && hasMod(p.id));
    });
    c.append(modLine(p.id, 'cw'));
    return c;
  }
  // 十字キー
  const c = h('div', { class: 'callout', 'data-item': it.id },
    h('div', { class: 'co-head' }, KIND_ICON.dpad, ' ', it.name, h('span', { class: 'pid' }, it.id)));
  const order = ['up', 'left', 'right', 'down'];
  it.members.slice().sort((a, b) => order.indexOf(a.dir) - order.indexOf(b.dir)).forEach(m => {
    const row = h('div', { class: 'co-row', 'data-flash': m.id },
      h('span', { class: 'ic' }, DIR_GLYPH[m.dir]), lbl(m.id), actBox(m.id));
    attachPress(row, m.id);
    partState(row, m.id);
    c.append(row);
  });
  bind(() => { c.classList.toggle('has-sel', it.members.some(m => m.id === S.sel)); });
  return c;
}

function drawLines(area, svg, items) {
  const ar = area.getBoundingClientRect();
  if (!ar.width) return;
  svg.setAttribute('viewBox', `0 0 ${ar.width} ${ar.height}`);
  const out = [];
  for (const it of items) {
    const c = area.querySelector(`.callout[data-item="${it.id}"]`);
    let target;
    if (it.type === 'group') {
      const selMember = it.members.find(m => m.id === S.sel);
      target = selMember ? area.querySelector(`.device [data-part="${selMember.id}"]`) : area.querySelector(`.device [data-group="${it.id}"]`);
    } else target = area.querySelector(`.device [data-part="${it.id}"]`);
    if (!c || !target) continue;
    const cr = c.getBoundingClientRect(), tr = target.getBoundingClientRect();
    const ax = (it.side === 'L' ? cr.right : cr.left) - ar.left;
    const ay = cr.top - ar.top + Math.min(20, cr.height / 2);
    const tx = tr.left + tr.width / 2 - ar.left;
    const ty = tr.top + tr.height / 2 - ar.top;
    const dx = (tx - ax) * 0.5;
    const ids = it.type === 'group' ? it.members.map(m => m.id) : [it.id];
    const sel = ids.includes(S.sel);
    const mod = modOn() && ids.some(hasMod);
    const cls = sel ? 'sel' : (mod ? 'mod' : '');
    out.push({ sel, svg:
      `<path class="ln ${cls}" d="M${ax},${ay} C${ax + dx},${ay} ${tx - dx * 0.7},${ty} ${tx},${ty}"/>` +
      `<circle class="ln-anc ${cls}" cx="${ax}" cy="${ay}" r="2.5"/>` +
      `<circle class="ln-dot ${cls}" cx="${tx}" cy="${ty}" r="${sel ? 5 : 4}"/>` });
  }
  out.sort((a, b) => a.sel - b.sel);
  svg.innerHTML = out.map(o => o.svg).join('');
}

function buildA(stage) {
  const root = h('div', { class: 'planA' });
  const area = h('div', { class: 'a-stage' });
  const colL = h('div', { class: 'a-col' }), colR = h('div', { class: 'a-col' });
  const devWrap = h('div', { class: 'a-dev' }, buildDevice('guide'));
  const svg = s('svg', { class: 'a-lines' });
  area.append(colL, devWrap, colR, svg);
  const drawer = h('aside', { class: 'drawer', id: 'editor-host' });
  root.append(area, drawer);
  stage.append(root);

  const items = calloutItems();
  for (const it of items) (it.side === 'L' ? colL : colR).append(buildCallout(it));
  lineDrawer = () => drawLines(area, svg, items);
  bind(() => root.classList.toggle('open', !!S.sel));
  // 引き出しの開閉で幅が変わる間も線を追いかける
  const ro = new ResizeObserver(() => lineDrawer && lineDrawer());
  ro.observe(area);
  $$('.callout', area).forEach(c => ro.observe(c));
  cleanups.push(() => ro.disconnect());
}

/* =====================================================================
   B案: カードを並べる
   ===================================================================== */
function cardHead(icon, name, id) {
  return h('div', { class: 'c-head' }, icon, ' ', name, h('span', { class: 'pid' }, id));
}

function buildB(stage) {
  const root = h('div', { class: 'planB' });
  const main = h('div', { class: 'b-main' });
  const grid = h('div', { class: 'b-grid' });

  // 上の集計
  const sum = h('div', { class: 'b-sum' });
  bind(() => {
    const st = curSet();
    let total = 0, filled = 0;
    for (const p of D.device.parts) {
      const a = st.base[p.id];
      if (p.kind === 'dial') { total += 2; filled += (a?.ccw ? 1 : 0) + (a?.cw ? 1 : 0); }
      else { total += 1; filled += a ? 1 : 0; }
    }
    const mods = Object.keys(st.mod || {}).length;
    sum.replaceChildren(
      h('span', {}, h('b', { class: 'lbl-anim' }, st.name), ' セット'),
      h('span', {}, '割り当て ', h('b', {}, filled), '/ ' + total),
      h('span', {}, '空き ', h('b', {}, total - filled)),
      h('span', { style: 'color:var(--mod)' }, '修飾で変わる ', h('b', { style: 'color:var(--mod)' }, mods)),
      h('span', { class: 'meter' }, h('i', { style: `width:${filled / total * 100}%` })));
  });
  main.append(sum, grid);

  const kindOrder = ['dial', 'dpad', 'btnL', 'mod', 'btnS', 'set'];
  const parts = D.device.parts.slice().sort((a, b) => kindOrder.indexOf(a.kind) - kindOrder.indexOf(b.kind));
  const doneGroups = new Set();
  for (const p of parts) {
    if (p.group) {
      if (doneGroups.has(p.group)) continue;
      doneGroups.add(p.group);
      const g = D.device.groups[p.group];
      const card = h('div', { class: 'card card-dpad' }, cardHead(KIND_ICON.dpad, g.name, p.group));
      const dg = h('div', { class: 'dpad-grid' }, h('div', { class: 'cell-hub' }));
      for (const m of D.device.parts.filter(x => x.group === p.group)) {
        const cell = h('div', { class: `cell ${m.dir}`, 'data-part': m.id },
          h('small', {}, DIR_GLYPH[m.dir]), h('div', { class: 'c-lbl' }, lbl(m.id)), actBox(m.id));
        attachPress(cell, m.id);
        partState(cell, m.id);
        dg.append(cell);
      }
      card.append(dg);
      bind(() => card.classList.toggle('is-selected', D.device.parts.some(x => x.group === p.group && x.id === S.sel)));
      grid.append(card);
      continue;
    }
    if (p.kind === 'dial') {
      const card = h('div', { class: 'card card-dial', 'data-part': p.id }, cardHead(KIND_ICON.dial, p.name, p.id));
      const half = slot => {
        const el = h('div', { class: 'half ' + slot, 'data-flash': `${p.id}.${slot}` },
          h('small', {}, slot === 'ccw' ? '⟲ 左回し' : '右回し ⟳'),
          h('div', { class: 'c-lbl' }, lbl(p.id, slot)), actBox(p.id, slot), modLine(p.id, slot));
        attachPress(el, p.id, { slot });
        bind(() => {
          el.classList.toggle('sel', S.sel === p.id && S.slot === slot);
          el.classList.toggle('is-mod', modOn() && hasMod(p.id));
        });
        return el;
      };
      card.append(h('div', { class: 'dial-row' }, half('ccw'), makeDial(p, 'mini'), half('cw')));
      partState(card, p.id);
      grid.append(card);
      continue;
    }
    const card = h('div', { class: 'card', 'data-part': p.id },
      cardHead(KIND_ICON[p.kind], p.name, p.id),
      h('div', { class: 'c-lbl' }, lbl(p.id)),
      h('div', { class: 'grow' }),
      actBox(p.id),
      modLine(p.id));
    attachPress(card, p.id);
    partState(card, p.id);
    grid.append(card);
  }

  const ed = h('aside', { class: 'b-editor', id: 'editor-host' });
  root.append(main, ed);
  stage.append(root);
}

/* =====================================================================
   C案: 実機に直接書く＋その場で開く編集
   ===================================================================== */
function buildC(stage) {
  const root = h('div', { class: 'planC' });
  const cs = h('div', { class: 'c-stage' });
  const pop = h('div', { class: 'popover', id: 'editor-host', 'data-side': 'R' });
  cs.append(h('div', { class: 'c-dev' }, buildDevice('live')), pop);
  root.append(cs);
  stage.append(root);
  cs.addEventListener('pointerdown', e => {
    // 押した部品の中身は押した瞬間に描き直されることがあるので、e.target ではなく経路で判定する
    if (e.composedPath().some(n => n.classList && (n.classList.contains('part') || n.classList.contains('dial') || n.classList.contains('popover')))) return;
    deselect();
  });
  bind(() => pop.classList.toggle('open', !!S.sel));
  const ro = new ResizeObserver(() => positionPopover());
  ro.observe(cs);
  cleanups.push(() => ro.disconnect());
}

function positionPopover() {
  if (S.plan !== 'C' || !S.sel) return;
  const pop = $('#editor-host');
  const cs = pop?.parentElement;
  const target = cs && cs.querySelector(`.device [data-part="${S.sel}"]`);
  if (!target) return;
  const sr = cs.getBoundingClientRect(), tr = target.getBoundingClientRect();
  const pw = pop.offsetWidth, ph = pop.offsetHeight, gap = 16, pad = 12;
  const spaceR = sr.right - tr.right, spaceL = tr.left - sr.left;
  const side = spaceR >= pw + gap + pad ? 'R' : spaceL >= pw + gap + pad ? 'L' : (spaceR >= spaceL ? 'R' : 'L');
  let left = side === 'R' ? tr.right - sr.left + gap : tr.left - sr.left - gap - pw;
  left = Math.max(pad, Math.min(sr.width - pw - pad, left));
  const cy = tr.top - sr.top + tr.height / 2;
  let top = cy - ph / 2;
  top = Math.max(pad, Math.min(sr.height - ph - pad, top));
  pop.dataset.side = side;
  pop.style.left = left + 'px';
  pop.style.top = top + 'px';
  const arrow = $('.pop-arrow', pop);
  if (arrow) arrow.style.top = Math.max(22, Math.min(ph - 22, cy - top)) + 'px';
}

/* =====================================================================
   編集パネル（3案共通）
   ===================================================================== */
function defaultAction(kind) {
  if (kind === 'chord') return { t: 'chord', keys: [] };
  if (kind === 'text') return { t: 'text', text: '' };
  if (kind === 'mo') return { t: 'mo', layer: D.layers.find(l => l.id !== 'base').id };
  return { t: 'set', to: 'next' };
}

function renderEditor() {
  const host = document.getElementById('editor-host');
  if (!host) return;
  const ed = buildEditor();
  if (S.plan === 'C') host.replaceChildren(h('div', { class: 'pop-arrow' }), ed);
  else host.replaceChildren(ed);
  if (S.plan === 'C') requestAnimationFrame(positionPopover);
}

function buildEditor() {
  const id = S.sel;
  if (!id) {
    return h('div', { class: 'ed ed-empty' }, h('div', {},
      h('div', { class: 'big' }, '◎'),
      h('b', {}, '部品を選んでください'),
      h('p', {}, '機器の絵かカードをタップすると、', h('br'), 'その部品の割り当てをここで編集できます。')));
  }
  const p = PARTS[id];
  const st = curSet();
  const layer = layerNow();
  const isDial = p.kind === 'dial';
  if (isDial && S.slot !== 'ccw' && S.slot !== 'cw') S.slot = 'cw';

  const ed = h('div', { class: 'ed' });
  ed.append(h('div', { class: 'ed-head' },
    minimap(id),
    h('div', { class: 'ed-title' },
      h('small', {}, D.device.kinds[p.kind] + ' ・ ' + id),
      h('b', {}, p.name),
      h('div', { class: 'ed-badges' },
        h('span', { class: 'badge set' }, st.name),
        h('span', { class: 'badge ' + layer }, layer === 'mod' ? '⇧ 修飾中' : '通常'))),
    S.plan === 'B' ? h('span') : h('button', { class: 'x-btn', 'aria-label': '閉じる', onclick: deselect }, '✕')));

  if (isDial) {
    const tabs = h('div', { class: 'slot-tabs' });
    for (const slot of ['ccw', 'cw']) {
      const a = slotOf(eff(id), id, slot);
      tabs.append(h('button', {
        class: 'slot-tab' + (S.slot === slot ? ' on' : ''), 'data-flash': `${id}.${slot}`,
        onclick: () => { S.slot = slot; paint(); renderEditor(); }
      }, h('small', {}, slot === 'ccw' ? '⟲ 左回し' : '⟳ 右回し'), h('span', {}, a ? (a.label || '名前なし') : '空き')));
    }
    ed.append(tabs);
  }

  const body = h('div', { class: 'ed-body' });
  const foot = h('div', { class: 'ed-foot' });
  ed.append(body, foot);

  // 修飾中なのに上書きがない = 通常へ透過している
  if (layer === 'mod' && !hasMod(id)) {
    const base = st.base[id];
    const baseSlot = slotOf(base, id, S.slot);
    body.append(h('div', { class: 'transparent' },
      h('p', {}, h('b', {}, '修飾中も通常と同じ'), 'です（透過）。', h('br'),
        '修飾キーを押していても、この部品は「', baseSlot ? baseSlot.label : '空き', '」のまま動きます。'),
      h('button', { class: 'pbtn mod', onclick: () => {
        st.mod = st.mod || {};
        st.mod[id] = clone(base) ?? (isDial ? { ccw: null, cw: null } : { label: '', action: defaultAction('chord') });
        paint(); renderEditor();
      } }, '修飾中だけ別の割り当てにする')));
    foot.append(h('span', { class: 'nosave' }, '保存はされません'));
    return ed;
  }

  const bag = layer === 'mod' ? st.mod : st.base;
  const getT = () => isDial ? (bag[id]?.[S.slot] ?? null) : (bag[id] ?? null);
  const setT = v => {
    if (isDial) {
      bag[id] = bag[id] || { ccw: null, cw: null };
      bag[id][S.slot] = v;
      if (layer === 'base' && !bag[id].ccw && !bag[id].cw) delete bag[id];
    } else if (v == null && layer === 'base') delete bag[id];
    else bag[id] = v;
  };
  const t = getT();

  if (!t) {
    body.append(h('div', { class: 'empty-slot' },
      h('div', { class: 'big' }, '＋'),
      h('b', {}, '空き'),
      h('p', {}, isDial ? `${S.slot === 'ccw' ? '左回し' : '右回し'}には何も割り当てられていません。` : 'この部品には何も割り当てられていません。'),
      h('button', { class: 'pbtn', onclick: () => {
        setT({ label: '', action: defaultAction('chord') });
        paint(); renderEditor();
        requestAnimationFrame(() => $('#ed-label')?.focus());
      } }, '割り当てを作る')));
  } else {
    // 見本
    const pvKey = h('div', { class: 'pv-key' });
    const pvAct = h('div');
    const refresh = () => {
      pvKey.textContent = t.label || '名前なし';
      pvAct.replaceChildren(actionView(t.action));
    };
    refresh();
    const update = () => { paint(); refresh(); };

    // 表示名
    const count = h('span', { class: 'count' });
    const inp = h('input', { class: 'inp', id: 'ed-label', maxlength: 16, placeholder: '例: 取り消し', autocomplete: 'off' });
    inp.value = t.label || '';
    count.textContent = `${inp.value.length}/16`;
    inp.addEventListener('input', () => { t.label = inp.value; count.textContent = `${inp.value.length}/16`; update(); });
    body.append(h('div', { class: 'field' }, h('label', { for: 'ed-label' }, '表示名', count), inp));

    // 動作の種類
    const kinds = h('div', { class: 'kinds' });
    for (const [k, info] of Object.entries(D.actionKinds)) {
      kinds.append(h('button', {
        class: 'kind' + (t.action?.t === k ? ' on' : ''), 'aria-pressed': t.action?.t === k ? 'true' : 'false',
        onclick: () => { if (t.action?.t === k) return; t.action = defaultAction(k); paint(); renderEditor(); }
      }, h('span', { class: 'ki' }, info.icon), info.name));
    }
    body.append(h('div', { class: 'field' }, h('div', { class: 'flabel' }, '動作'), kinds));

    // 種類ごとの中身
    const act = t.action || (t.action = defaultAction('chord'));
    if (act.t === 'chord') body.append(chordFields(act, update));
    else if (act.t === 'text') body.append(textFields(act, update));
    else if (act.t === 'mo') body.append(moFields(act, update));
    else if (act.t === 'set') body.append(setFields(act, update));

    body.append(h('div', { class: 'field' }, h('div', { class: 'flabel' }, '見え方'),
      h('div', { class: 'preview' }, pvKey, h('div', {}, h('small', {}, layer === 'mod' ? '修飾キーを押している間' : '押すと'), pvAct))));

    foot.append(h('button', { class: 'gbtn warn', onclick: () => { setT(null); paint(); renderEditor(); } }, '空きにする'));
  }
  if (layer === 'mod' && hasMod(id)) {
    foot.append(h('button', { class: 'gbtn', onclick: () => { delete st.mod[id]; paint(); renderEditor(); } }, '透過に戻す'));
  }
  foot.append(h('span', { class: 'nosave' }, '保存はされません'));
  return ed;
}

function normKey(e) {
  const map = { ' ': 'Space', ArrowLeft: '←', ArrowRight: '→', ArrowUp: '↑', ArrowDown: '↓', Escape: 'Esc', Backspace: 'BkSp' };
  if (map[e.key]) return map[e.key];
  if (/^Key[A-Z]$/.test(e.code)) return e.code.slice(3);
  if (/^Digit\d$/.test(e.code)) return e.code.slice(5);
  if (e.key.length === 1) return e.key.toUpperCase();
  return e.key;
}

function chordFields(act, update) {
  const keys = act.keys || (act.keys = []);
  const mods = new Set(keys.filter(k => MODKEYS.includes(k)));
  let main = keys.filter(k => !MODKEYS.includes(k)).join('+');
  const commit = () => { act.keys = [...MODKEYS.filter(m => mods.has(m)), ...(main ? [main] : [])]; update(); };

  const wrap = h('div', { class: 'field' }, h('div', { class: 'flabel' }, 'キー'));
  const modRow = h('div', { class: 'chips', style: 'margin-bottom:8px' });
  for (const m of MODKEYS) {
    const b = h('button', { class: 'tchip', 'aria-pressed': mods.has(m) ? 'true' : 'false' }, m);
    b.addEventListener('click', () => {
      mods.has(m) ? mods.delete(m) : mods.add(m);
      b.setAttribute('aria-pressed', mods.has(m) ? 'true' : 'false');
      commit();
    });
    modRow.append(b);
  }
  const mainInp = h('input', { class: 'inp', maxlength: 10, placeholder: '主キー（例: Z）', autocomplete: 'off', autocapitalize: 'off', spellcheck: 'false' });
  mainInp.value = main;
  mainInp.addEventListener('input', () => {
    let v = mainInp.value.trim();
    if (v.length === 1) v = v.toUpperCase();
    mainInp.value = v; main = v; commit();
  });
  const cap = h('button', { class: 'tchip capture', title: 'PCのキーボードで押したキーを読み取る（送信はしない）' }, '⌨ 押して登録');
  cap.addEventListener('click', () => {
    cap.classList.add('wait'); cap.textContent = '押してください…';
    const onKey = e => {
      if (['Control', 'Shift', 'Alt', 'Meta'].includes(e.key)) return;
      e.preventDefault(); e.stopPropagation();
      window.removeEventListener('keydown', onKey, true);
      if (e.key === 'Escape') { renderEditor(); return; }
      mods.clear();
      if (e.ctrlKey) mods.add('Ctrl');
      if (e.shiftKey) mods.add('Shift');
      if (e.altKey) mods.add('Alt');
      if (e.metaKey) mods.add('Win');
      main = normKey(e);
      commit(); renderEditor();
    };
    window.addEventListener('keydown', onKey, true);
  });
  const quick = h('div', { class: 'chips', style: 'margin-top:8px' });
  for (const q of ['Z', 'Y', 'S', 'A', 'Space', 'Enter', 'Tab', 'Delete', '←', '→', '[', ']', '+', '-']) {
    quick.append(h('button', { class: 'tchip small', onclick: () => { main = q; mainInp.value = q; commit(); } }, q));
  }
  wrap.append(modRow, h('div', { class: 'row2' }, mainInp, cap), quick);
  return wrap;
}

function textFields(act, update) {
  const count = h('span', { class: 'count' });
  const ta = h('textarea', { class: 'inp', id: 'ed-text', placeholder: '例: 「……っ！」', maxlength: 200 });
  ta.value = act.text || '';
  count.textContent = `${ta.value.length}文字`;
  ta.addEventListener('input', () => { act.text = ta.value; count.textContent = `${ta.value.length}文字`; update(); });
  return h('div', { class: 'field' }, h('label', { for: 'ed-text' }, '入力する文字', count), ta,
    h('div', { class: 'note', style: 'margin-top:8px' }, '押すと、この文字がそのまま入力されます。改行も入ります。'));
}

function moFields(act, update) {
  const sel = h('select', { class: 'inp', id: 'ed-layer' });
  for (const l of D.layers.filter(x => x.id !== 'base')) {
    const o = h('option', { value: l.id }, l.name);
    if (l.id === act.layer) o.selected = true;
    sel.append(o);
  }
  sel.addEventListener('change', () => { act.layer = sel.value; update(); });
  return h('div', { class: 'field' }, h('label', { for: 'ed-layer' }, '切り替え先'), sel,
    h('div', { class: 'note', style: 'margin-top:8px' },
      h('div', { class: 'hold-diagram' },
        h('span', {}, '押す'), h('b', {}, '→ 「' + layerName(act.layer) + '」の割り当てになる'),
        h('span', {}, '離す'), h('b', {}, '→ 通常に戻る')),
      h('div', { style: 'margin-top:6px' }, '修飾中に書いていない部品は、通常と同じ動作をします（透過）。')));
}

function setFields(act, update) {
  const wrap = h('div', { class: 'chips' });
  const opts = [{ to: 'next', name: '次のセット' }, { to: 'prev', name: '前のセット' }, ...D.sets.map(x => ({ to: x.id, name: x.name, hue: x.hue }))];
  for (const o of opts) {
    const b = h('button', { class: 'tchip', 'aria-pressed': act.to === o.to ? 'true' : 'false' },
      o.hue != null ? h('i', { class: 'set-dot', style: `background:hsl(${o.hue} 80% 60%)` }) : null, o.name);
    b.addEventListener('click', () => {
      act.to = o.to;
      $$('.tchip', wrap).forEach(x => x.setAttribute('aria-pressed', 'false'));
      b.setAttribute('aria-pressed', 'true');
      update();
    });
    wrap.append(b);
  }
  return h('div', { class: 'field' }, h('div', { class: 'flabel' }, '切り替え先'), wrap);
}

/* =====================================================================
   上の帯
   ===================================================================== */
function buildTop() {
  const sets = $('#sets');
  sets.append(h('span', { class: 'seg-ind' }));
  D.sets.forEach((x, i) => {
    sets.append(h('button', { 'data-set': x.id, onclick: () => setSet(x.id), title: `${x.name}（${i + 1}キー）` },
      h('i', { class: 'set-dot', style: `background:hsl(${x.hue} 80% 60%)` }), x.name));
  });
  const plans = $('#plans');
  plans.append(h('span', { class: 'seg-ind' }));
  for (const [k, info] of Object.entries(PLAN_INFO)) {
    plans.append(h('button', { 'data-plan': k, onclick: () => setPlan(k) }, info.name));
  }
  $('#modBtn').addEventListener('click', () => { S.modLatch = !S.modLatch; paint(); renderEditor(); });
  $('#soundBtn').addEventListener('click', () => { S.sound = !S.sound; if (S.sound) audio.tick('cw'); paintTop(); });
  $('#themeBtn').addEventListener('click', () => {
    const r = document.documentElement;
    r.dataset.theme = r.dataset.theme === 'light' ? 'dark' : 'light';
    remember();
  });
  window.addEventListener('resize', paintTop);
}

function moveInd(nav, active) {
  const ind = $('.seg-ind', nav);
  if (!ind || !active) return;
  ind.style.width = active.offsetWidth + 'px';
  ind.style.transform = `translateX(${active.offsetLeft - 3}px)`;
  ind.style.left = '3px';
}

function paintTop() {
  $$('#sets button').forEach(b => b.classList.toggle('active', b.dataset.set === S.setId));
  $$('#plans button').forEach(b => b.classList.toggle('active', b.dataset.plan === S.plan));
  moveInd($('#sets'), $('#sets button.active'));
  moveInd($('#plans'), $('#plans button.active'));
  $('#modBtn').setAttribute('aria-pressed', S.modLatch ? 'true' : 'false');
  $('#soundBtn').setAttribute('aria-pressed', S.sound ? 'true' : 'false');
  $('#hint').textContent = PLAN_INFO[S.plan].hint;
}

function setSet(id) {
  if (id === S.setId) return;
  S.setId = id;
  swapAnim();
  paint();
  renderEditor();
}

function setPlan(k) {
  if (k === S.plan) return;
  S.plan = k;
  if (k === 'B' && !S.sel) S.sel = D.device.parts[0].id;
  remember();
  build();
}

function build() {
  cleanups.forEach(f => f());
  cleanups = [];
  binders = [];
  lineDrawer = null;
  const stage = $('#stage');
  stage.replaceChildren();
  ({ A: buildA, B: buildB, C: buildC })[S.plan](stage);
  paint();
  renderEditor();
}

window.addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('input, textarea, select')) return;
  if (e.key === 'Escape') deselect();
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= D.sets.length && !e.ctrlKey && !e.metaKey && !e.altKey) setSet(D.sets[n - 1].id);
});

buildTop();
if (S.plan === 'B') S.sel = D.device.parts[0].id;
build();
})();
</script>
