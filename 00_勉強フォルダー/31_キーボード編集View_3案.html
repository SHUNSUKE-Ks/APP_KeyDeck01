<!doctype html>
<html lang="ja" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KeyDeck 割り当て編集</title>
<style>
/* =====================================================================
   決めごと（デザイントークン）。数値はすべてここで決め、下では変数だけ使う。
   一覧と意味は 32_キーボード編集View_デザインメモ.md にもある。
   ===================================================================== */
:root {
  /* 書体（端末にあるものだけ） */
  --font: system-ui, -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Meiryo", sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;

  /* 角丸 */
  --r-xs: 6px;
  --r-sm: 10px;
  --r-md: 14px;
  --r-lg: 20px;
  --r-pill: 999px;

  /* 動きの長さ */
  --t-press: 70ms;    /* 沈む */
  --t-fast: 140ms;    /* 色・枠の切り替え */
  --t-med: 220ms;     /* 表示の入れ替え・ポップオーバー */
  --t-slow: 360ms;    /* 引き出しの開閉 */
  --t-glow: 420ms;    /* 押した光が消えるまで */
  --ease-out: cubic-bezier(.22, 1, .36, 1);
  --ease-spring: cubic-bezier(.34, 1.56, .64, 1);

  /* 触れる大きさ */
  --hit: 44px;

  /* セットごとに変わる色相（JSがデータの hue を入れる） */
  --hue: 212;
}

/* ---- 暗い配色（既定） ---- */
:root, :root[data-theme="dark"] {
  --bg: #0b0e13;
  --surface-1: #11151c;
  --surface-2: #171c24;
  --surface-3: #1e242e;
  --surface-4: #29303b;
  --line: rgba(255, 255, 255, .07);
  --line-2: rgba(255, 255, 255, .15);
  --text-1: #e8ecf2;
  --text-2: #a3adbb;
  --text-3: #6c7686;

  --acc: hsl(var(--hue) 92% 67%);
  --acc-soft: hsl(var(--hue) 92% 67% / .14);
  --acc-line: hsl(var(--hue) 92% 67% / .55);
  --acc-ink: hsl(var(--hue) 60% 10%);
  --mod: #ffb54a;
  --mod-soft: rgba(255, 181, 74, .15);
  --mod-line: rgba(255, 181, 74, .6);
  --mod-ink: #2a1a02;

  --dev-1: #1b2029;
  --dev-2: #12161d;
  --key-top: linear-gradient(180deg, #2c333f, #222831);
  --key-top-pressed: linear-gradient(180deg, #232932, #1d222a);
  --key-edge: #07090c;
  --knob: radial-gradient(circle at 36% 30%, #3d4553, #1b2028 72%);

  --sh-key: 0 3px 0 var(--key-edge), 0 8px 16px rgba(0, 0, 0, .35), inset 0 1px 0 rgba(255, 255, 255, .06);
  --sh-key-pressed: 0 0 0 var(--key-edge), 0 2px 5px rgba(0, 0, 0, .4), inset 0 2px 6px rgba(0, 0, 0, .5);
  --sh-float: 0 24px 60px rgba(0, 0, 0, .55), 0 2px 8px rgba(0, 0, 0, .35);
  --sh-card: 0 1px 0 rgba(255, 255, 255, .03) inset, 0 8px 22px rgba(0, 0, 0, .22);
  color-scheme: dark;
}

/* ---- 明るい配色（切り替え時だけ。真っ白は使わない） ---- */
:root[data-theme="light"] {
  --bg: #e6eaf0;
  --surface-1: #eef1f5;
  --surface-2: #f6f7f9;
  --surface-3: #e8ecf1;
  --surface-4: #dde2e9;
  --line: rgba(15, 23, 42, .08);
  --line-2: rgba(15, 23, 42, .17);
  --text-1: #151b24;
  --text-2: #4a5462;
  --text-3: #8791a0;

  --acc: hsl(var(--hue) 72% 44%);
  --acc-soft: hsl(var(--hue) 72% 44% / .12);
  --acc-line: hsl(var(--hue) 72% 44% / .5);
  --acc-ink: #fff;
  --mod: #c97800;
  --mod-soft: rgba(201, 120, 0, .12);
  --mod-line: rgba(201, 120, 0, .55);
  --mod-ink: #fff;

  --dev-1: #d6dce4;
  --dev-2: #c8cfd9;
  --key-top: linear-gradient(180deg, #fbfcfd, #e9edf2);
  --key-top-pressed: linear-gradient(180deg, #e4e8ee, #dfe4ea);
  --key-edge: #a9b3c0;
  --knob: radial-gradient(circle at 36% 30%, #ffffff, #cfd6df 75%);

  --sh-key: 0 3px 0 var(--key-edge), 0 6px 14px rgba(40, 50, 70, .16), inset 0 1px 0 rgba(255, 255, 255, .9);
  --sh-key-pressed: 0 0 0 var(--key-edge), 0 1px 3px rgba(40, 50, 70, .2), inset 0 2px 5px rgba(40, 50, 70, .18);
  --sh-float: 0 24px 60px rgba(40, 50, 70, .25), 0 2px 8px rgba(40, 50, 70, .12);
  --sh-card: 0 6px 18px rgba(40, 50, 70, .08);
  color-scheme: light;
}

/* =====================================================================
   土台
   ===================================================================== */
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--text-1);
  font: 14px/1.5 var(--font);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  overflow: hidden;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
kbd { font-family: var(--mono); }

.app {
  display: grid;
  grid-template-rows: 60px 1fr 40px;
  height: 100dvh;
  min-height: 600px;
}

/* ---- 上の帯 ---- */
.topbar {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 0 16px;
  border-bottom: 1px solid var(--line);
  background: var(--surface-1);
  position: relative;
  z-index: 20;
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 150px; }
.brand-mark {
  width: 28px; height: 28px; border-radius: 9px;
  background: conic-gradient(from 200deg, var(--acc), hsl(calc(var(--hue) + 60) 90% 65%), var(--acc));
  box-shadow: 0 0 18px var(--acc-line);
  transition: background var(--t-med);
}
.brand b { display: block; font-size: 14px; letter-spacing: .02em; }
.brand small { display: block; font-size: 11px; color: var(--text-3); line-height: 1.2; }

.seg {
  position: relative;
  display: flex;
  padding: 3px;
  border-radius: var(--r-pill);
  background: var(--surface-3);
  border: 1px solid var(--line);
}
.seg button {
  position: relative; z-index: 1;
  min-height: 38px;
  padding: 0 14px;
  border: 0; background: none;
  border-radius: var(--r-pill);
  color: var(--text-2);
  font-weight: 600; font-size: 13px;
  display: flex; align-items: center; gap: 7px;
  white-space: nowrap;
  transition: color var(--t-fast);
}
.seg button.active { color: var(--text-1); }
.seg-ind {
  position: absolute; z-index: 0; top: 3px; bottom: 3px; left: 0;
  border-radius: var(--r-pill);
  background: var(--surface-4);
  box-shadow: 0 1px 0 rgba(255, 255, 255, .06) inset, 0 2px 8px rgba(0, 0, 0, .25);
  transition: transform var(--t-med) var(--ease-out), width var(--t-med) var(--ease-out), background var(--t-med);
}
.sets .seg-ind { background: hsl(var(--hue) 70% 55% / .22); box-shadow: inset 0 0 0 1px var(--acc-line); }
.set-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.sets kbd { font-size: 10px; color: var(--text-3); }

.tools { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.tbtn {
  min-height: 40px; padding: 0 14px;
  border-radius: var(--r-pill);
  border: 1px solid var(--line-2);
  background: var(--surface-2);
  font-weight: 600; font-size: 13px;
  display: flex; align-items: center; gap: 8px;
  transition: background var(--t-fast), border-color var(--t-fast), color var(--t-fast), transform var(--t-press);
}
.tbtn:active { transform: scale(.97); }
.tbtn .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-3); transition: background var(--t-fast), box-shadow var(--t-fast); }
.tbtn[aria-pressed="true"].mod-toggle { background: var(--mod-soft); border-color: var(--mod-line); color: var(--mod); }
.tbtn[aria-pressed="true"].mod-toggle .dot { background: var(--mod); box-shadow: 0 0 8px var(--mod); }
.icon-btn {
  width: 40px; height: 40px; border-radius: 50%;
  border: 1px solid var(--line-2); background: var(--surface-2);
  display: grid; place-items: center; font-size: 16px;
  transition: background var(--t-fast), color var(--t-fast), transform var(--t-press);
}
.icon-btn:active { transform: scale(.94); }
.icon-btn[aria-pressed="true"] { background: var(--acc-soft); color: var(--acc); border-color: var(--acc-line); }

/* ---- 下の帯（状態の見本） ---- */
.legend {
  display: flex; align-items: center; gap: 16px;
  padding: 0 16px;
  border-top: 1px solid var(--line);
  background: var(--surface-1);
  font-size: 12px; color: var(--text-2);
  overflow: hidden; white-space: nowrap;
}
.lg { display: flex; align-items: center; gap: 6px; }
.lg-sw {
  width: 22px; height: 16px; border-radius: 5px;
  background: var(--key-top); box-shadow: 0 2px 0 var(--key-edge);
}
.lg-sw.pressed { box-shadow: inset 0 2px 4px rgba(0, 0, 0, .5); transform: translateY(2px); background: var(--key-top-pressed); position: relative; }
.lg-sw.pressed::after { content: ""; position: absolute; inset: 0; border-radius: inherit; background: radial-gradient(circle, var(--acc-line), transparent 70%); }
.lg-sw.selected { outline: 2px solid var(--acc); outline-offset: 2px; }
.lg-sw.mod { box-shadow: 0 2px 0 var(--key-edge), inset 0 0 0 1.5px var(--mod), 0 0 10px var(--mod-line); }
.lg-sw.empty { background: transparent; box-shadow: none; border: 1.5px dashed var(--line-2); }
.lg-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--mod); box-shadow: 0 0 6px var(--mod); }
.legend .hint { margin-left: auto; color: var(--text-3); overflow: hidden; text-overflow: ellipsis; }
.legend .proto { color: var(--text-3); border: 1px solid var(--line-2); border-radius: var(--r-pill); padding: 1px 8px; }

.stage { position: relative; min-height: 0; overflow: hidden; }

/* =====================================================================
   共通の部品: 押せるもの・状態
   ===================================================================== */
.pressable { position: relative; overflow: hidden; user-select: none; -webkit-user-select: none; touch-action: none; }
.ripple {
  position: absolute; border-radius: 50%; pointer-events: none;
  background: var(--acc); opacity: .32;
  transform: scale(0);
  animation: ripple var(--t-glow) var(--ease-out) forwards;
}
@keyframes ripple { to { transform: scale(1); opacity: 0; } }

.flash { animation: flash var(--t-glow) var(--ease-out); }
@keyframes flash {
  0% { box-shadow: 0 0 0 0 var(--acc-line); background-color: var(--acc-soft); }
  100% { box-shadow: 0 0 0 12px transparent; }
}

/* 修飾で変わる部品の印（修飾していないとき） */
.st.has-mod:not(.is-mod)::before {
  content: ""; position: absolute; z-index: 3;
  top: 7px; right: 7px; width: 6px; height: 6px; border-radius: 50%;
  background: var(--mod); box-shadow: 0 0 6px var(--mod);
  pointer-events: none;
}
/* 修飾中は、変わらない部品を沈める */
.st { transition: opacity var(--t-med), border-color var(--t-fast), background-color var(--t-fast), box-shadow var(--t-fast), transform var(--t-press) ease-out, outline-offset var(--t-fast); }
.mod-on .st:not(.is-mod):not(.is-held) { opacity: .42; }

/* セット切替の入れ替わり */
.swap .lbl-anim { animation: swapIn var(--t-med) var(--ease-out); }
@keyframes swapIn { from { opacity: 0; transform: translateY(5px); } }

.lbl-anim { display: inline-block; }
.lbl-anim.is-empty { color: var(--text-3); font-weight: 500; }

/* 動作の見せ方（キー・文字・切替） */
.act { display: inline-flex; align-items: center; flex-wrap: wrap; gap: 3px; min-height: 20px; }
.kc {
  display: inline-block; min-width: 20px; padding: 1px 6px;
  font-size: 11px; line-height: 16px; text-align: center; font-weight: 600;
  border-radius: 5px;
  background: var(--surface-4); color: var(--text-1);
  box-shadow: 0 2px 0 var(--key-edge);
}
.kc-plus { color: var(--text-3); font-size: 10px; }
.chip {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 1px 8px; border-radius: var(--r-pill);
  font-size: 11px; line-height: 18px; font-weight: 600;
  background: var(--surface-4); color: var(--text-2);
  max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.chip-text { background: hsl(150 50% 50% / .14); color: hsl(150 55% 62%); }
.chip-mo { background: var(--mod-soft); color: var(--mod); }
.chip-set .set-dot { width: 7px; height: 7px; }
:root[data-theme="light"] .chip-text { color: hsl(150 60% 30%); }
.act-none { font-size: 11px; color: var(--text-3); }

.modline { font-size: 11px; color: var(--mod); display: flex; gap: 4px; align-items: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.modline[hidden] { display: none; }

/* =====================================================================
   機器の絵（A・C 共通）
   ===================================================================== */
.device {
  position: relative;
  aspect-ratio: 100 / 72;
  width: 100%;
  container-type: inline-size;
}
.device-body {
  position: absolute; inset: 0;
  border-radius: 5.5cqw;
  background:
    radial-gradient(120% 90% at 20% 0%, rgba(255, 255, 255, .05), transparent 60%),
    linear-gradient(160deg, var(--dev-1), var(--dev-2));
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .07), inset 0 0 0 1px var(--line), var(--sh-float);
}
.device-body::after {
  content: "KeyDeck"; position: absolute; right: 4cqw; bottom: 2.4cqw;
  font-size: max(9px, 1.1cqw); letter-spacing: .35em; font-weight: 700;
  color: var(--text-3); opacity: .6;
}
.set-strip {
  position: absolute; left: 4cqw; bottom: 2.6cqw;
  display: flex; gap: .8cqw; align-items: center;
  font-size: max(9px, 1.1cqw); color: var(--text-3); font-weight: 600;
}
.set-strip i { width: 1.6cqw; height: .5cqw; min-width: 10px; min-height: 3px; border-radius: 9px; background: var(--line-2); transition: background var(--t-med), box-shadow var(--t-med); }
.set-strip i.on { background: var(--acc); box-shadow: 0 0 8px var(--acc-line); }

.part {
  position: absolute;
  border-radius: 1.8cqw;
  background: var(--key-top);
  box-shadow: var(--sh-key);
  color: var(--text-1);
  cursor: pointer;
  display: grid; place-items: center;
  outline: 0 solid transparent; outline-offset: 7px;
}
.part::after {
  content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background: radial-gradient(circle at 50% 55%, var(--acc-line), transparent 72%);
  opacity: 0; transition: opacity var(--t-glow) ease-out;
}
.part.is-pressed { transform: translateY(.35cqw) scale(.97); box-shadow: var(--sh-key-pressed); background: var(--key-top-pressed); }
.part.is-pressed::after { opacity: 1; transition-duration: 40ms; }
.part.is-selected { outline: 2.5px solid var(--acc); outline-offset: 4px; }
.part.is-empty { background: transparent; box-shadow: none; border: 1.5px dashed var(--line-2); }
.part.is-mod { box-shadow: var(--sh-key), inset 0 0 0 2px var(--mod), 0 0 22px var(--mod-line); }
.part.is-mod .p-lbl { color: var(--mod); }
.part.k-mod.is-held { background: linear-gradient(180deg, #ffc978, #f0a02e); color: var(--mod-ink); box-shadow: var(--sh-key-pressed), 0 0 26px var(--mod-line); transform: translateY(.35cqw); }
.part.k-mod.is-held .p-id { color: var(--mod-ink); }
.part:focus-visible { outline: 2.5px solid var(--acc); outline-offset: 4px; }

.p-id {
  position: absolute; top: .7cqw; left: 1cqw;
  font: 600 max(8px, .95cqw)/1 var(--mono);
  color: var(--text-3);
}
.p-glyph { font-size: max(10px, 2cqw); color: var(--text-3); }
.p-lbl {
  font-size: max(10px, 1.55cqw); font-weight: 700; line-height: 1.2;
  text-align: center; padding: 0 .9cqw;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  word-break: keep-all; overflow-wrap: anywhere;
}
.k-btnS .p-lbl, .k-set .p-lbl { font-size: max(9px, 1.2cqw); }
.p-live { display: grid; gap: .5cqw; justify-items: center; padding-top: 1cqw; width: 100%; }
.p-act { transform: scale(clamp(.7, calc(100cqw / 1000px), 1.1)); }
.p-sub { font-size: max(8px, 1cqw); color: var(--mod); max-width: 92%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* 十字キー */
.dpad { position: absolute; }
.dpad-hub {
  position: absolute; left: 31%; top: 31%; width: 38%; height: 38%;
  border-radius: 22%;
  background: var(--surface-1);
  box-shadow: inset 0 2px 6px rgba(0, 0, 0, .45);
}
.part.k-dpad { border-radius: 1.4cqw; }
.arm-up { border-bottom-left-radius: .6cqw !important; border-bottom-right-radius: .6cqw !important; }
.arm-down { border-top-left-radius: .6cqw !important; border-top-right-radius: .6cqw !important; }
.arm-left { border-top-right-radius: .6cqw !important; border-bottom-right-radius: .6cqw !important; }
.arm-right { border-top-left-radius: .6cqw !important; border-bottom-left-radius: .6cqw !important; }
.k-dpad .p-lbl { font-size: max(9px, 1.15cqw); padding: 0 .4cqw; }
.k-dpad .p-glyph { font-size: max(9px, 1.3cqw); }
.device-live .k-dpad .p-glyph { position: absolute; font-size: max(8px, .9cqw); opacity: .7; }
.device-live .arm-up .p-glyph { top: .5cqw; }
.device-live .arm-down .p-glyph { bottom: .5cqw; }
.device-live .arm-left .p-glyph { left: .6cqw; }
.device-live .arm-right .p-glyph { right: .6cqw; }

/* ダイヤル */
.dial {
  position: absolute;
  border-radius: 50%;
  cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none;
  background: radial-gradient(circle, var(--surface-1) 63%, var(--surface-3) 64%, var(--surface-2) 100%);
  box-shadow: inset 0 0 0 1px var(--line), 0 10px 26px rgba(0, 0, 0, .35);
  outline: 0 solid transparent; outline-offset: 7px;
}
.dial.is-grabbed { cursor: grabbing; }
.dial.is-selected { outline: 2.5px solid var(--acc); outline-offset: 4px; }
.dial.is-empty { background: transparent; box-shadow: inset 0 0 0 1.5px var(--line-2); }
.dial.is-mod { box-shadow: inset 0 0 0 2px var(--mod), 0 0 26px var(--mod-line); }
.dial:focus-visible { outline: 2.5px solid var(--acc); outline-offset: 4px; }
.dial-ticks {
  position: absolute; inset: 3%; border-radius: 50%; pointer-events: none;
  background: repeating-conic-gradient(from -1deg, var(--line-2) 0 2deg, transparent 2deg 15deg);
  -webkit-mask: radial-gradient(circle, transparent 60%, #000 61%, #000 70%, transparent 71%);
          mask: radial-gradient(circle, transparent 60%, #000 61%, #000 70%, transparent 71%);
}
.dial-S .dial-ticks { background: repeating-conic-gradient(from -1.5deg, var(--line-2) 0 3deg, transparent 3deg 20deg); }
.knob {
  position: absolute; inset: 19%; border-radius: 50%;
  background: var(--knob);
  box-shadow: 0 8px 18px rgba(0, 0, 0, .45), inset 0 1px 0 rgba(255, 255, 255, .1), inset 0 -2px 6px rgba(0, 0, 0, .35);
  transition: transform 90ms var(--ease-out), box-shadow var(--t-press);
  pointer-events: none;
}
.knob::before { /* 刻み目 */
  content: ""; position: absolute; left: 50%; top: 6%;
  width: 5%; height: 15%; margin-left: -2.5%; border-radius: 9px;
  background: var(--acc); box-shadow: 0 0 10px var(--acc-line);
}
.knob::after { /* ローレット */
  content: ""; position: absolute; inset: 0; border-radius: 50%;
  background: repeating-conic-gradient(rgba(255, 255, 255, .035) 0 3deg, transparent 3deg 6deg);
}
.dial.is-grabbed .knob { transition-duration: 50ms; box-shadow: 0 4px 10px rgba(0, 0, 0, .5), inset 0 1px 0 rgba(255, 255, 255, .1); }
.dial-face {
  position: absolute; inset: 22%; border-radius: 50%; pointer-events: none;
  display: grid; grid-template-columns: 1fr 1fr; align-items: center;
  font-weight: 700; font-size: max(9px, 1.25cqw); line-height: 1.2;
}
.df { padding: 0 6%; display: grid; gap: .3cqw; border-radius: var(--r-sm); }
.df b { font-size: max(8px, .9cqw); color: var(--text-3); font-weight: 600; }
.df-ccw { text-align: left; justify-items: start; padding-left: 12%; }
.df-cw { text-align: right; justify-items: end; padding-right: 12%; }
.df.flash { animation: dfFlash 300ms var(--ease-out); }
@keyframes dfFlash { 0% { color: var(--acc); transform: scale(1.08); } }
.dial.is-mod .df .lbl-anim { color: var(--mod); }
.dial-readout {
  position: absolute; left: 50%; bottom: 23%; transform: translate(-50%, 6px);
  padding: 2px 10px; border-radius: var(--r-pill);
  background: var(--acc); color: var(--acc-ink);
  font-size: max(10px, 1.1cqw); font-weight: 700; white-space: nowrap;
  opacity: 0; pointer-events: none;
  transition: opacity var(--t-fast), transform var(--t-fast) var(--ease-out);
}
.dial-readout.show { opacity: 1; transform: translate(-50%, 0); }
.device-guide .dial-readout { bottom: -14%; }
.dial.mini .dial-readout { bottom: -30%; font-size: 11px; }
.dial.mini { position: relative; width: 84px; height: 84px; flex: none; }
.dial .p-id { top: 8%; left: 50%; transform: translateX(-50%); z-index: 2; }
.dial.st.has-mod:not(.is-mod)::before { top: 14%; right: 14%; }
.dial-S .dial-face { inset: 20%; font-size: max(8px, .95cqw); }
.dial-S .df { padding: 0 2%; }
.dial-S .df b { display: none; }
.dial-S .df .lbl-anim { word-break: keep-all; overflow-wrap: anywhere; }

/* =====================================================================
   A案: 機器の絵＋引き出し線
   ===================================================================== */
.planA {
  display: grid;
  grid-template-columns: 1fr 0px;
  height: 100%;
  transition: grid-template-columns var(--t-slow) var(--ease-out);
}
.planA.open { grid-template-columns: 1fr 360px; }
.a-stage {
  position: relative; min-width: 0;
  display: grid;
  grid-template-columns: 200px minmax(0, 1fr) 200px;
  gap: 20px;
  padding: 14px 18px;
}
.a-col { display: flex; flex-direction: column; justify-content: center; gap: 8px; min-height: 0; z-index: 2; }
.a-dev { position: relative; container-type: size; display: grid; place-items: center; min-width: 0; z-index: 1; }
.a-dev .device { width: min(100cqw, 100cqh * 1.388); }
.a-lines { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 3; overflow: visible; }
.ln { fill: none; stroke: var(--text-3); stroke-opacity: .5; stroke-width: 1.2; transition: stroke var(--t-fast); }
.ln.mod { stroke: var(--mod); stroke-opacity: .8; }
.ln.sel { stroke: var(--acc); stroke-opacity: 1; stroke-width: 2; filter: drop-shadow(0 0 4px var(--acc-line)); }
.ln-dot { fill: var(--surface-1); stroke: var(--text-2); stroke-width: 1.5; }
.ln-dot.mod { stroke: var(--mod); }
.ln-dot.sel { fill: var(--acc); stroke: var(--surface-1); stroke-width: 2; }
.ln-anc { fill: var(--text-3); }
.ln-anc.sel { fill: var(--acc); }

.callout {
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  padding: 7px 10px 8px;
  cursor: pointer;
  box-shadow: var(--sh-card);
}
.callout.is-pressed { transform: scale(.975); }
.callout.is-selected, .callout.has-sel {
  border-color: var(--acc-line);
  background: linear-gradient(180deg, var(--acc-soft), transparent 80%), var(--surface-2);
  box-shadow: 0 0 0 3px var(--acc-soft), var(--sh-card);
}
.callout.is-mod { border-color: var(--mod-line); background: linear-gradient(180deg, var(--mod-soft), transparent 80%), var(--surface-2); }
.callout.is-mod .co-lbl { color: var(--mod); }
.callout.is-held { border-color: var(--mod); background: var(--mod-soft); }
.co-head { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-3); min-height: 18px; }
.co-head .pid { margin-left: auto; font: 600 10px/1 var(--mono); padding: 3px 5px; border-radius: 5px; background: var(--surface-4); color: var(--text-2); }
.co-main { display: flex; align-items: center; gap: 8px; margin: 2px 0 1px; }
.co-main .act { flex-wrap: nowrap; }
.co-main > span { flex: none; max-width: 62%; overflow: hidden; }
.co-lbl { flex: 1; min-width: 0; font-size: 15px; font-weight: 700; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.co-lbl .lbl-anim { display: inline; }
.co-row {
  position: relative;
  display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; align-items: center; gap: 6px;
  padding: 3px 6px; margin: 0 -6px; border-radius: 8px;
  font-size: 13px; font-weight: 650; min-height: 30px;
}
.co-row .ic { color: var(--text-3); font-size: 12px; text-align: center; }
.co-row .lbl-anim { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.co-row.is-selected { background: var(--acc-soft); }
.co-row.is-selected .ic { color: var(--acc); }
.co-row.is-mod .lbl-anim { color: var(--mod); }
.co-row.is-empty .act { display: none; }
.co-row.has-mod:not(.is-mod)::before { top: 12px; right: auto; left: -2px; }

.drawer {
  min-width: 0; overflow: hidden;
  border-left: 1px solid var(--line);
  background: var(--surface-1);
}
.drawer > .ed { width: 360px; }

/* =====================================================================
   B案: カードを並べる
   ===================================================================== */
.planB { display: grid; grid-template-columns: minmax(0, 1fr) 360px; height: 100%; }
.b-main { overflow: auto; padding: 14px 18px 16px; }
.b-sum {
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  margin-bottom: 12px; font-size: 12px; color: var(--text-2);
}
.b-sum b { font-size: 18px; color: var(--text-1); font-weight: 750; margin-right: 2px; }
.b-sum .meter { flex: 1; min-width: 120px; height: 6px; border-radius: 9px; background: var(--surface-3); overflow: hidden; }
.b-sum .meter i { display: block; height: 100%; background: var(--acc); border-radius: inherit; transition: width var(--t-med) var(--ease-out); }
.b-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  grid-auto-flow: row dense;
  gap: 10px;
}
.card {
  position: relative;
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: 10px 12px 12px;
  min-height: 92px;
  display: flex; flex-direction: column; gap: 3px;
  box-shadow: var(--sh-card);
  cursor: pointer;
}
.card.pressable.is-pressed { transform: translateY(1px) scale(.975); }
.card.is-selected { border-color: var(--acc-line); box-shadow: 0 0 0 3px var(--acc-soft), var(--sh-card); background: linear-gradient(180deg, var(--acc-soft), transparent 70%), var(--surface-2); }
.card.is-empty { background: transparent; border-style: dashed; border-color: var(--line-2); box-shadow: none; }
.card.is-mod { border-color: var(--mod-line); background: linear-gradient(180deg, var(--mod-soft), transparent 70%), var(--surface-2); }
.card.is-mod .c-lbl { color: var(--mod); }
.card.is-held { border-color: var(--mod); background: var(--mod-soft); }
.c-head { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-3); }
.c-head .pid { margin-left: auto; font: 600 10px/1 var(--mono); padding: 3px 5px; border-radius: 5px; background: var(--surface-4); color: var(--text-2); }
.c-lbl { font-size: 17px; font-weight: 750; line-height: 1.25; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card .grow { flex: 1; }
.card-dial { grid-column: span 2; cursor: default; }
.card-dpad { grid-column: span 2; grid-row: span 2; cursor: default; }
.dial-row { display: grid; grid-template-columns: minmax(0, 1fr) 84px minmax(0, 1fr); gap: 10px; align-items: center; flex: 1; }
.half {
  border-radius: var(--r-md); padding: 8px 10px; min-height: 76px;
  background: var(--surface-3); border: 1px solid transparent;
  display: flex; flex-direction: column; gap: 3px; cursor: pointer;
}
.half.is-pressed { transform: scale(.97); }
.half.sel { border-color: var(--acc-line); background: var(--acc-soft); }
.half.is-mod .c-lbl { color: var(--mod); }
.half .c-lbl { font-size: 15px; }
.half small { font-size: 11px; color: var(--text-3); }
.half.cw { text-align: right; align-items: flex-end; }
.dpad-grid { flex: 1; display: grid; grid-template-columns: 1fr 1fr 1fr; grid-template-rows: 1fr 1fr 1fr; gap: 6px; margin-top: 4px; }
.cell {
  border-radius: var(--r-md); padding: 6px 8px;
  background: var(--surface-3); border: 1px solid transparent;
  display: flex; flex-direction: column; justify-content: center; gap: 3px;
  cursor: pointer; min-width: 0;
}
.cell.is-pressed { transform: scale(.96); }
.cell.is-selected { border-color: var(--acc-line); background: var(--acc-soft); }
.cell.is-empty { background: transparent; border: 1px dashed var(--line-2); }
.cell.is-mod { border-color: var(--mod-line); }
.cell.is-mod .c-lbl { color: var(--mod); }
.cell .c-lbl { font-size: 13px; }
.cell small { font-size: 11px; color: var(--text-3); }
.cell-hub { grid-area: 2 / 2; border-radius: 50%; background: var(--surface-1); box-shadow: inset 0 2px 6px rgba(0, 0, 0, .4); place-self: center; width: 70%; aspect-ratio: 1; }
.cell.up { grid-area: 1 / 2; } .cell.down { grid-area: 3 / 2; } .cell.left { grid-area: 2 / 1; } .cell.right { grid-area: 2 / 3; }
.b-editor { border-left: 1px solid var(--line); background: var(--surface-1); min-height: 0; }

/* =====================================================================
   C案: 実機に直接書く＋その場で開く編集
   ===================================================================== */
.planC { height: 100%; }
.c-stage { position: relative; height: 100%; container-type: size; display: grid; place-items: center; }
.c-dev { width: min(100cqw - 40px, (100cqh - 32px) * 1.388); }
.popover {
  position: absolute; z-index: 10; left: 0; top: 0;
  width: 360px; max-height: calc(100% - 24px);
  display: flex; flex-direction: column;
  background: color-mix(in srgb, var(--surface-2) 92%, transparent);
  -webkit-backdrop-filter: blur(18px) saturate(1.3);
          backdrop-filter: blur(18px) saturate(1.3);
  border: 1px solid var(--line-2);
  border-radius: var(--r-lg);
  box-shadow: var(--sh-float);
  opacity: 0; transform: scale(.96); transform-origin: left center;
  pointer-events: none;
  transition: opacity var(--t-med) var(--ease-out), transform var(--t-med) var(--ease-out), left var(--t-med) var(--ease-out), top var(--t-med) var(--ease-out);
}
.popover[data-side="L"] { transform-origin: right center; }
.popover.open { opacity: 1; transform: none; pointer-events: auto; }
.popover > .ed { min-height: 0; flex: 1; }
.pop-arrow {
  position: absolute; width: 14px; height: 14px; top: 50%; margin-top: -7px;
  background: var(--surface-2); border: 1px solid var(--line-2);
  transform: rotate(45deg); transition: top var(--t-med) var(--ease-out);
}
.popover[data-side="R"] .pop-arrow { left: -8px; border-top: 0; border-right: 0; }
.popover[data-side="L"] .pop-arrow { right: -8px; border-bottom: 0; border-left: 0; }

/* =====================================================================
   編集パネル（3案で共通）
   ===================================================================== */
.ed { display: flex; flex-direction: column; height: 100%; min-height: 0; }
.ed-head {
  display: grid; grid-template-columns: 76px minmax(0, 1fr) auto; gap: 12px; align-items: center;
  padding: 14px 14px 12px;
  border-bottom: 1px solid var(--line);
}
.minimap { width: 76px; height: 56px; display: block; }
.minimap .mm-body { fill: var(--surface-3); stroke: var(--line-2); stroke-width: .6; }
.minimap .mm-p { fill: var(--surface-4); cursor: pointer; transition: fill var(--t-fast); }
.minimap .mm-p.sel { fill: var(--acc); }
.minimap .mm-p.mod { fill: var(--mod); }
.ed-title small { display: block; font-size: 11px; color: var(--text-3); }
.ed-title b { display: block; font-size: 17px; line-height: 1.3; }
.ed-badges { display: flex; gap: 6px; margin-top: 5px; flex-wrap: wrap; }
.badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: var(--r-pill); background: var(--surface-4); color: var(--text-2); }
.badge.mod { background: var(--mod-soft); color: var(--mod); }
.badge.set { background: var(--acc-soft); color: var(--acc); }
.x-btn { width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--surface-3); color: var(--text-2); font-size: 16px; align-self: start; }
.x-btn:active { transform: scale(.94); }

.slot-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 10px 14px 0; }
.slot-tab {
  min-height: 52px; border-radius: var(--r-md);
  border: 1px solid var(--line); background: var(--surface-2);
  display: grid; justify-items: start; align-content: center; padding: 4px 12px; text-align: left;
  transition: border-color var(--t-fast), background var(--t-fast);
}
.slot-tab small { font-size: 11px; color: var(--text-3); }
.slot-tab span { font-weight: 700; font-size: 14px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.slot-tab.on { border-color: var(--acc-line); background: var(--acc-soft); }
.slot-tab.on small { color: var(--acc); }
.slot-tab.flash { animation: flash var(--t-glow) var(--ease-out); }

.ed-body { flex: 1; min-height: 0; overflow: auto; padding: 14px; display: flex; flex-direction: column; gap: 16px; }
.field > label, .field > .flabel { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-2); margin-bottom: 6px; font-weight: 600; }
.field .count { color: var(--text-3); font-weight: 500; }
.inp {
  width: 100%; min-height: var(--hit); padding: 0 12px;
  border-radius: var(--r-sm); border: 1px solid var(--line-2);
  background: var(--surface-1); font-size: 16px;
  transition: border-color var(--t-fast), box-shadow var(--t-fast);
}
textarea.inp { padding: 10px 12px; min-height: 88px; resize: vertical; line-height: 1.5; }
select.inp { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--text-2) 50%), linear-gradient(135deg, var(--text-2) 50%, transparent 50%); background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%; background-size: 5px 5px; background-repeat: no-repeat; }
.inp:focus { outline: none; border-color: var(--acc); box-shadow: 0 0 0 3px var(--acc-soft); }

.kinds { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.kind {
  min-height: 52px; border-radius: var(--r-md);
  border: 1px solid var(--line); background: var(--surface-2);
  display: flex; align-items: center; gap: 10px; padding: 0 12px; text-align: left;
  font-size: 13px; font-weight: 650; line-height: 1.25;
  transition: border-color var(--t-fast), background var(--t-fast), transform var(--t-press);
}
.kind:active { transform: scale(.97); }
.kind .ki { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; background: var(--surface-4); font-size: 14px; flex: none; }
.kind.on { border-color: var(--acc-line); background: var(--acc-soft); }
.kind.on .ki { background: var(--acc); color: var(--acc-ink); }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.tchip {
  min-height: 40px; min-width: 44px; padding: 0 12px;
  border-radius: var(--r-sm); border: 1px solid var(--line-2); background: var(--surface-2);
  font-weight: 650; font-size: 13px;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  transition: background var(--t-fast), border-color var(--t-fast), transform var(--t-press);
}
.tchip:active { transform: scale(.95); }
.tchip[aria-pressed="true"] { background: var(--acc); border-color: var(--acc); color: var(--acc-ink); }
.tchip.small { min-height: 34px; min-width: 38px; padding: 0 9px; font-family: var(--mono); font-size: 12px; }
.row2 { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
.capture.wait { background: var(--acc-soft); border-color: var(--acc); color: var(--acc); animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 4px var(--acc-soft); } }

.preview {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 12px; border-radius: var(--r-md);
  background: var(--surface-2); border: 1px solid var(--line);
}
.preview .pv-key {
  min-width: 64px; height: 44px; padding: 0 10px; border-radius: 10px;
  display: grid; place-items: center; font-weight: 700; font-size: 13px;
  background: var(--key-top); box-shadow: var(--sh-key);
  max-width: 140px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
}
.preview small { display: block; color: var(--text-3); font-size: 11px; }
.note { font-size: 12px; color: var(--text-2); line-height: 1.6; padding: 10px 12px; border-radius: var(--r-md); background: var(--surface-2); border: 1px solid var(--line); }
.note b { color: var(--text-1); }
.hold-diagram { display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; align-items: center; margin-top: 8px; }
.hold-diagram span:nth-child(odd) { font-size: 11px; color: var(--text-3); }

.ed-foot { display: flex; gap: 8px; align-items: center; padding: 10px 14px; border-top: 1px solid var(--line); }
.ed-foot .nosave { margin-left: auto; font-size: 11px; color: var(--text-3); }
.gbtn { min-height: 40px; padding: 0 14px; border-radius: var(--r-sm); border: 1px solid var(--line-2); background: var(--surface-2); font-size: 13px; font-weight: 650; }
.gbtn:active { transform: scale(.97); }
.gbtn.warn { color: #ff8a8a; }
:root[data-theme="light"] .gbtn.warn { color: #c0392b; }
.pbtn { min-height: var(--hit); padding: 0 18px; border-radius: var(--r-sm); border: 0; background: var(--acc); color: var(--acc-ink); font-weight: 750; font-size: 14px; }
.pbtn.mod { background: var(--mod); color: var(--mod-ink); }
.pbtn:active { transform: scale(.97); }

.ed-empty { display: grid; place-items: center; height: 100%; padding: 24px; text-align: center; color: var(--text-2); }
.ed-empty .big { font-size: 34px; opacity: .5; }
.ed-empty b { display: block; color: var(--text-1); font-size: 15px; margin: 6px 0 4px; }
.ed-empty p { margin: 0; font-size: 13px; line-height: 1.7; }
.empty-slot { display: grid; justify-items: center; gap: 8px; padding: 26px 16px; border: 1.5px dashed var(--line-2); border-radius: var(--r-lg); text-align: center; }
.empty-slot .big { font-size: 26px; color: var(--text-3); }
.empty-slot p { margin: 0 0 6px; font-size: 13px; color: var(--text-2); }
.transparent { display: grid; gap: 10px; padding: 16px; border-radius: var(--r-lg); background: var(--mod-soft); border: 1px solid var(--mod-line); }
.transparent p { margin: 0; font-size: 13px; line-height: 1.7; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 1ms !important; transition-duration: 1ms !important; }
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark"></span>
      <div><b>KeyDeck</b><small>割り当ての編集</small></div>
    </div>
    <nav class="seg sets" id="sets" aria-label="セット"></nav>
    <div class="tools">
      <button class="tbtn mod-toggle" id="modBtn" aria-pressed="false" title="修飾キーを押しているときの割り当てを表示"><span class="dot"></span>修飾中を見る</button>
      <nav class="seg plans" id="plans" aria-label="デザイン案"></nav>
      <button class="icon-btn" id="soundBtn" aria-pressed="false" title="目盛りの音">♪</button>
      <button class="icon-btn" id="themeBtn" title="明るさの切り替え">◐</button>
    </div>
  </header>

  <main class="stage" id="stage"></main>

  <footer class="legend">
    <span class="lg"><i class="lg-sw"></i>通常</span>
    <span class="lg"><i class="lg-sw pressed"></i>押下中</span>
    <span class="lg"><i class="lg-sw selected"></i>選択中</span>
    <span class="lg"><i class="lg-sw mod"></i>修飾中</span>
    <span class="lg"><i class="lg-sw empty"></i>空き</span>
    <span class="lg"><i class="lg-dot"></i>修飾で変わる</span>
    <span class="hint" id="hint"></span>
    <span class="proto">試作・保存しません</span>
  </footer>
</div>

<script>
/* =====================================================================
   割り当てデータ（架空: 漫画制作アプリのショートカット）
   見た目はすべてこの1つのオブジェクトから描く。差し替えればそのまま動く。

   - device.parts   … 部品。座標は 100×72 の機器の上での位置（左上が 0,0）
                       ダイヤルは cx,cy（中心）と d（直径）、他は x,y,w,h
                       group を持つ部品（十字キー）は groups の枠の中に並ぶ
   - sets[].base    … 通常の割り当て
   - sets[].mod     … 修飾キーを押している間の割り当て。書いていない部品は
                       通常と同じ（透過）。null を書くと「修飾中は空き」
   - 割り当て        … { label: 表示名, action: 動作 }
                       ダイヤルは { ccw: 左回し, cw: 右回し }
   - 動作 action.t   … chord（キーの組み合わせ） / text（文字の入力）
                       mo（押している間だけ別の割り当て） / set（セット切替）
   ===================================================================== */
const KEYDECK_DATA = {
  device: {
    name: "左手デバイス（iPad）",
    width: 100,
    height: 72,
    kinds: {
      dial: "ダイヤル", dpad: "十字キー", btnL: "大きいボタン",
      btnS: "小さいボタン", mod: "修飾キー", set: "セット切替"
    },
    groups: {
      DP: { name: "十字キー", cx: 40, cy: 29, size: 26 }
    },
    parts: [
      { id: "S1",  kind: "btnS", name: "小ボタン1", x: 27, y: 4,  w: 11, h: 7 },
      { id: "S2",  kind: "btnS", name: "小ボタン2", x: 41, y: 4,  w: 11, h: 7 },

  C: { name: 'C 実機',   hint: '部品をタップするとその横で編集 ・ 何もない所をタップで閉じる ・ MODを左手で押したまま右手で他を触れる' }
};

const S = {

};
try {
