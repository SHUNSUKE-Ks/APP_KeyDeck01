<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>KeyDeck 実験 — 1マス多重操作の判定</title>
<!--
  REQ-20260929-001「1アイコン多重操作（SpaceMouse風）」の段階1。
  1マスの上で パン／ズーム／回転／傾け／左右ボタン をどこまで取り違えずに見分けられるかを測る。

  ■ このページは PC へ何も送らない
  WebSocket も fetch も使わない。判定はすべてこの端末の中で行い、結果は画面と
  この端末のブラウザ（localStorage）にだけ残る。Hub はこのファイルを配るだけ。

  ■ 見分け方（依頼の「パンとズームが両方とも縦ドラッグ」がぶつかるため、指の本数と時間で分けた）
    1本指で動かす            → パン（上下左右）
    2本指でつまむ／広げる    → ズーム（広げる＝イン）
    2本指でひねる            → 回転（時計回り／反時計回り）
    長押ししてから動かす      → 傾け（上下左右）
    左右の端の帯をタップ      → 左ボタン／右ボタン
  どれにも当たらずに指を離したら「なし」。
-->
<style>
  :root {
    --bg: #0f1218; --panel: #171b24; --panel2: #1e2330; --line: #2c3344;
    --text: #e6e9f0; --dim: #8b93a7; --accent: #4f8cff; --ok: #2fbf71; --ng: #e5484d;
    --warn: #e0a526; --band: rgba(79,140,255,0.12);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Hiragino Sans", "Yu Gothic UI", sans-serif; }
  body { padding: 12px 16px 40px; }
  h1 { font-size: 17px; margin: 0 0 4px; }
  .sub { color: var(--dim); font-size: 12px; margin-bottom: 10px; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-start; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  .card h2 { font-size: 13px; margin: 0 0 8px; color: var(--dim); font-weight: 600; }
  button, select, input[type=number] {
    background: var(--panel2); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 12px; font-size: 14px; }
  button:active { transform: translateY(1px); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { color: var(--ng); }
  label { font-size: 13px; }
  .fam { display: inline-flex; gap: 4px; align-items: center; margin: 0 10px 6px 0; }
  .tabs { display: flex; gap: 6px; margin-bottom: 10px; }
  .tabs button[aria-pressed=true] { background: var(--accent); border-color: var(--accent); color: #fff; }

  /* 試す場所。中央に「1マス」、その周りは何も起きない余白 */
  #stage { position: relative; display: flex; align-items: center; justify-content: center;
    min-height: 380px; min-width: 380px; background: repeating-linear-gradient(45deg, #12161e 0 10px, #141922 10px 20px);
    border-radius: 12px; border: 1px solid var(--line); }
  #pad { position: relative; background: var(--panel2); border: 2px solid #3a4460; border-radius: 12px;
    touch-action: none; user-select: none; -webkit-user-select: none; overflow: hidden; }
  #pad .band { position: absolute; top: 0; bottom: 0; background: var(--band); pointer-events: none; }
  #pad .band.l { left: 0; border-right: 1px dashed #3a4460; }
  #pad .band.r { right: 0; border-left: 1px dashed #3a4460; }
  #pad .lbl { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 12px; color: var(--dim); pointer-events: none; text-align: center; }
  #pad.armed { border-color: var(--warn); box-shadow: 0 0 0 3px rgba(224,165,38,0.35); }
  #pad.committed { border-color: var(--accent); }
  .dot { position: absolute; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%;
    background: rgba(255,255,255,0.25); border: 2px solid #fff; pointer-events: none; }

  #target { font-size: 30px; font-weight: 700; min-height: 42px; }
  #howto { color: var(--dim); font-size: 13px; min-height: 18px; }
  #verdict { font-size: 22px; font-weight: 700; min-height: 30px; }
  #verdict.ok { color: var(--ok); } #verdict.ng { color: var(--ng); }
  .meter { height: 6px; background: var(--panel2); border-radius: 3px; overflow: hidden; margin-top: 6px; }
  .meter > i { display: block; height: 100%; background: var(--accent); width: 0; }

  table { border-collapse: collapse; font-size: 12px; }
  th, td { border: 1px solid var(--line); padding: 4px 6px; text-align: center; min-width: 34px; }
  th { background: var(--panel2); color: var(--dim); font-weight: 600; }
  td.diag { background: rgba(47,191,113,0.18); }
  td.miss { background: rgba(229,72,77,0.22); }
  .scroll { overflow-x: auto; max-width: 100%; }
  ul.log { list-style: none; padding: 0; margin: 0; font-size: 13px; max-height: 220px; overflow: auto; }
  ul.log li { padding: 3px 0; border-bottom: 1px solid var(--line); }
  textarea { width: 100%; min-height: 140px; background: var(--panel2); color: var(--text);
    border: 1px solid var(--line); border-radius: 8px; font-family: ui-monospace, Consolas, monospace; font-size: 11px; }
  .grid2 { display: grid; grid-template-columns: auto auto; gap: 6px 10px; font-size: 13px; align-items: center; }
  .hide { display: none !important; }
  @media (max-width: 700px) { #stage { min-width: 0; width: 100%; } }
</style>
</head>
<body>
  <h1>実験: 1マスに操作をいくつ積めるか（SpaceMouse風）</h1>
  <div class="sub">REQ-20260929-001 段階1。<b>このページはPCへ何も送りません。</b>判定と記録はこの端末の中だけで行います。</div>

  <div class="row">
    <div class="card" style="flex: 1 1 520px;">
      <div class="tabs">
        <button id="tabTrial" aria-pressed="true">お題モード（測る）</button>
        <button id="tabFree" aria-pressed="false">自由モード（慣れる）</button>
      </div>

      <div id="trialHead">
        <div id="target">―</div>
        <div id="howto">「開始」を押すと、お題がランダムに出ます。</div>
        <div class="meter"><i id="progress"></i></div>
        <div style="font-size:12px;color:var(--dim);margin-top:4px" id="progressText"></div>
      </div>
      <div id="verdict"></div>

      <div id="stage">
        <div id="pad">
          <div class="band l"></div><div class="band r"></div>
          <div class="lbl" id="padLabel">ここが1マス</div>
        </div>
      </div>

      <div style="margin-top:10px; display:flex; gap:8px; flex-wrap:wrap;">
        <button class="primary" id="btnStart">開始（お題を作り直す）</button>
        <button id="btnUndo">直前を取り消す</button>
        <button id="btnSkip">このお題を飛ばす</button>
      </div>
    </div>

    <div class="card" style="flex: 0 1 340px;">
      <h2>試す操作（外すと「積む数」が減る）</h2>
      <div id="famBox"></div>
      <h2 style="margin-top:10px">マスの大きさ</h2>
      <select id="sizeSel">
        <option value="114x109">1マス（iPad 12.9 横・12×9 の1区画 114×109）</option>
        <option value="228x218">2×2 区画（228×218）</option>
        <option value="342x327">3×3 区画（342×327）</option>
        <option value="62x62">iPhone 7 の1マス（62×62）</option>
      </select>
      <h2 style="margin-top:10px">お題の回数（1操作あたり）</h2>
      <input type="number" id="reps" min="1" max="20" value="4">
      <h2 style="margin-top:10px">判定のしきい値</h2>
      <div class="grid2">
        <label for="thTap">動いたとみなす距離(px)</label><input type="number" id="thTap" value="10">
        <label for="thDir">向きを決める距離(px)</label><input type="number" id="thDir" value="24">
        <label for="thHold">長押しの時間(ms)</label><input type="number" id="thHold" value="500">
        <label for="thTapMs">タップの長さの上限(ms)</label><input type="number" id="thTapMs" value="300">
        <label for="thEdge">端の帯の幅(%)</label><input type="number" id="thEdge" value="22">
        <label for="thPinch">つまみ量(%)</label><input type="number" id="thPinch" value="18">
        <label for="thTwist">ひねり角(度)</label><input type="number" id="thTwist" value="20">
      </div>
      <div style="font-size:11px;color:var(--dim);margin-top:6px">変えると、そこから先の記録に新しい値が残ります。</div>
    </div>
  </div>

  <div class="row" style="margin-top:12px">
    <div class="card" style="flex: 1 1 520px;">
      <h2>結果 — 取り違え表（行＝お題、列＝判定）</h2>
      <div id="summary" style="font-size:14px;margin-bottom:8px"></div>
      <div class="scroll"><table id="matrix"></table></div>
      <h2 style="margin-top:12px">混ざった組み合わせ（多い順）</h2>
      <ul class="log" id="confusions"></ul>
    </div>
    <div class="card" style="flex: 0 1 340px;">
      <h2>自由モードの記録（新しい順）</h2>
      <ul class="log" id="freeLog"></ul>
      <h2 style="margin-top:12px">書き出し</h2>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px">
        <button id="btnCopy">JSONをコピー</button>
        <button id="btnDownload">JSONを保存</button>
        <button class="danger" id="btnClear">記録を全部消す</button>
      </div>
      <textarea id="out" readonly></textarea>
    </div>
  </div>

<script>
"use strict";
// ======================================================================
// 操作の種類（判定の出口）。id は将来 Hub へ送る「位置ID」の候補でもある
// （段階2で部品にするなら、端末はこの id だけを送り、何が起きるかは Hub の JSON が決める）
// ======================================================================
var FAMILIES = [
  { id: "pan",    name: "パン（1本指で動かす）",       classes: ["PAN_N", "PAN_E", "PAN_S", "PAN_W"] },
  { id: "zoom",   name: "ズーム（2本指でつまむ・広げる）", classes: ["ZOOM_IN", "ZOOM_OUT"] },
  { id: "rotate", name: "回転（2本指でひねる）",       classes: ["ROT_CW", "ROT_CCW"] },
  { id: "tilt",   name: "傾け（長押ししてから動かす）", classes: ["TILT_N", "TILT_E", "TILT_S", "TILT_W"] },
  { id: "side",   name: "左右ボタン（端の帯をタップ）", classes: ["SIDE_L", "SIDE_R"] },
];
var LABEL = {
  PAN_N: "パン ↑", PAN_E: "パン →", PAN_S: "パン ↓", PAN_W: "パン ←",
  ZOOM_IN: "ズーム イン", ZOOM_OUT: "ズーム アウト",
  ROT_CW: "回転 ↻", ROT_CCW: "回転 ↺",
  TILT_N: "傾け ↑", TILT_E: "傾け →", TILT_S: "傾け ↓", TILT_W: "傾け ←",
  SIDE_L: "左ボタン", SIDE_R: "右ボタン", NONE: "なし",
};
var HOWTO = {
  pan: "1本指で置いて、すぐその向きへ動かす",
  zoom: "2本指で、イン＝広げる／アウト＝つまむ",
  rotate: "2本指で、↻＝時計回り／↺＝反時計回りにひねる",
  tilt: "1本指で長押し（枠が黄色くなる）してから、その向きへ動かす",
  side: "左右の青い帯を、動かさずに短くタップ",
};
function familyOf(cls) {
  for (var i = 0; i < FAMILIES.length; i++) if (FAMILIES[i].classes.indexOf(cls) >= 0) return FAMILIES[i].id;
  return null;
}

// ---- 保存（この端末のブラウザだけ。使えなくても動く） ----
var STORE_KEY = "keydeck.lab.multigesture.v1";
function load() { try { return JSON.parse(localStorage.getItem(STORE_KEY) || "null"); } catch (e) { return null; } }
function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) { /* 保存できなくても計測は続ける */ } }

var state = load() || { enabled: { pan: true, zoom: true, rotate: true, tilt: true, side: true },
  size: "114x109", reps: 4, trials: [], free: [], queue: [], th: null };
state.enabled = state.enabled || {};

var $ = function (id) { return document.getElementById(id); };
var TH_IDS = { tap: "thTap", dir: "thDir", hold: "thHold", tapMs: "thTapMs", edge: "thEdge", pinch: "thPinch", twist: "thTwist" };
function readTh() {
  var t = {};
  for (var k in TH_IDS) t[k] = Number($(TH_IDS[k]).value) || 0;
  return t;
}
if (state.th) for (var k0 in TH_IDS) if (state.th[k0] != null) $(TH_IDS[k0]).value = state.th[k0];
for (var k1 in TH_IDS) $(TH_IDS[k1]).addEventListener("change", function () { state.th = readTh(); save(); applyEdge(); });

// ---- 設定の画面 ----
var famBox = $("famBox");
FAMILIES.forEach(function (f) {
  if (state.enabled[f.id] === undefined) state.enabled[f.id] = true;
  var l = document.createElement("label"); l.className = "fam";
  var c = document.createElement("input"); c.type = "checkbox"; c.checked = !!state.enabled[f.id];
  c.addEventListener("change", function () { state.enabled[f.id] = c.checked; save(); });
  l.appendChild(c); l.appendChild(document.createTextNode(f.name));
  famBox.appendChild(l); famBox.appendChild(document.createElement("br"));
});
$("sizeSel").value = state.size; $("reps").value = state.reps;
$("sizeSel").addEventListener("change", function () { state.size = this.value; save(); applySize(); });
$("reps").addEventListener("change", function () { state.reps = Math.max(1, Math.min(20, Number(this.value) || 4)); save(); });

var pad = $("pad");
function applySize() {
  var p = state.size.split("x");
  pad.style.width = p[0] + "px"; pad.style.height = p[1] + "px";
  $("padLabel").textContent = p[0] + "×" + p[1];
  applyEdge();
}
function applyEdge() {
  var pct = readTh().edge;
  pad.querySelector(".band.l").style.width = pct + "%";
  pad.querySelector(".band.r").style.width = pct + "%";
}
applySize();

// ======================================================================
// 判定（1回の操作＝最初の指が触れてから、全部の指が離れるまで）
// ======================================================================
var ptrs = {};         // pointerId -> {x0,y0,x,y}
var g = null;          // いまの操作
var dots = {};

function nowMs() { return performance.now(); }
function enabledOf(fam) { return !!state.enabled[fam]; }
function dirOf(dx, dy) {
  if (Math.abs(dx) >= Math.abs(dy)) return dx > 0 ? "E" : "W";
  return dy > 0 ? "S" : "N";
}
function twoFinger() {
  var ids = Object.keys(ptrs);
  var a = ptrs[ids[0]], b = ptrs[ids[1]];
  var dx = b.x - a.x, dy = b.y - a.y;
  return { d: Math.hypot(dx, dy), ang: Math.atan2(dy, dx) };
}
function angDiff(a, b) {
  var d = a - b;
  while (d > Math.PI) d -= 2 * Math.PI;
  while (d < -Math.PI) d += 2 * Math.PI;
  return d;
}
function commit(cls, margin) {
  if (g.result) return;
  g.result = cls;
  g.latency = Math.round(nowMs() - g.t0);
  g.margin = margin == null ? null : Math.round(margin * 100) / 100;
  pad.classList.remove("armed");
  pad.classList.add("committed");
  $("verdict").textContent = "判定: " + LABEL[cls];
  $("verdict").className = "";
}

function onDown(e) {
  e.preventDefault();
  // 取れなくても判定は続ける（取れないと、指が枠の外へ出たときに move が届かなくなるだけ）
  try { pad.setPointerCapture(e.pointerId); } catch (err) { /* noop */ }
  var r = pad.getBoundingClientRect();
  var x = e.clientX - r.left, y = e.clientY - r.top;
  ptrs[e.pointerId] = { x0: x, y0: y, x: x, y: y };
  showDot(e.pointerId, x, y);
  var n = Object.keys(ptrs).length;
  if (!g) {
    g = { t0: nowMs(), x0: x, y0: y, w: r.width, h: r.height, maxFingers: 1, maxMove: 0,
      result: null, armed: false, two: null, notes: [], th: readTh() };
    g.holdTimer = setTimeout(function () {
      // 長押し: 1本のまま・まだ動いていない・まだ決まっていない
      if (g && !g.result && Object.keys(ptrs).length === 1 && g.maxMove < g.th.tap && enabledOf("tilt")) {
        g.armed = true; pad.classList.add("armed");
      }
    }, g.th.hold);
    $("verdict").textContent = ""; pad.classList.remove("committed");
    return;
  }
  g.maxFingers = Math.max(g.maxFingers, n);
  if (n === 2 && !g.result) {
    // 1本目がまだ決まっていなければ、2本指の操作として測り直す
    g.two = twoFinger(); g.two.d0 = g.two.d; g.two.a0 = g.two.ang;
    g.armed = false; pad.classList.remove("armed");
  } else if (n >= 2) {
    g.notes.push("決定後に指が増えた（無視）");
  }
}

function onMove(e) {
  var p = ptrs[e.pointerId];
  if (!p || !g) return;
  e.preventDefault();
  var r = pad.getBoundingClientRect();
  p.x = e.clientX - r.left; p.y = e.clientY - r.top;
  showDot(e.pointerId, p.x, p.y);
  var n = Object.keys(ptrs).length;
  var th = g.th;

  if (n >= 2 && g.two) {
    var t = twoFinger();
    var s = Math.abs(Math.log(t.d / Math.max(1, g.two.d0))) / Math.log(1 + th.pinch / 100); // つまみ量の比
    var dA = angDiff(t.ang, g.two.a0);
    var rr = Math.abs(dA) / (th.twist * Math.PI / 180);                                     // ひねり量の比
    g.two.s = s; g.two.r = rr;
    if (g.result) return;
    var zOn = enabledOf("zoom"), rOn = enabledOf("rotate");
    if (zOn && s >= 1 && (!rOn || s >= rr)) commit(t.d > g.two.d0 ? "ZOOM_IN" : "ZOOM_OUT", rOn ? rr / s : null);
    else if (rOn && rr >= 1 && (!zOn || rr > s)) commit(dA > 0 ? "ROT_CW" : "ROT_CCW", zOn ? s / rr : null);
    return;
  }
  if (n !== 1) return;
  var dx = p.x - p.x0, dy = p.y - p.y0, dist = Math.hypot(dx, dy);
  g.maxMove = Math.max(g.maxMove, dist);
  if (g.result || g.two) return;
  if (dist >= th.dir) {
    var d = dirOf(dx, dy);
    // 向きのはっきりさ（0＝斜め45度ちょうど、1＝まっすぐ）
    var clear = Math.abs(Math.abs(dx) - Math.abs(dy)) / Math.max(Math.abs(dx), Math.abs(dy));
    if (g.armed && enabledOf("tilt")) commit("TILT_" + d, 1 - clear);
    else if (enabledOf("pan")) commit("PAN_" + d, 1 - clear);
  }
}

function onUp(e) {
  if (!ptrs[e.pointerId]) return;
  e.preventDefault();
  delete ptrs[e.pointerId];
  hideDot(e.pointerId);
  if (Object.keys(ptrs).length > 0 || !g) return;
  clearTimeout(g.holdTimer);
  var dur = Math.round(nowMs() - g.t0);
  if (!g.result && g.maxFingers === 1 && g.maxMove < g.th.tap && dur <= g.th.tapMs && enabledOf("side")) {
    var edge = g.w * g.th.edge / 100;
    if (g.x0 <= edge) commit("SIDE_L", null);
    else if (g.x0 >= g.w - edge) commit("SIDE_R", null);
  }
  if (!g.result) commit("NONE", null);
  finish(g, dur);
  g = null;
  pad.classList.remove("armed");
}

function showDot(id, x, y) {
  var d = dots[id];
  if (!d) { d = document.createElement("div"); d.className = "dot"; pad.appendChild(d); dots[id] = d; }
  d.style.left = x + "px"; d.style.top = y + "px";
}
function hideDot(id) { if (dots[id]) { dots[id].remove(); delete dots[id]; } }

pad.addEventListener("pointerdown", onDown);
pad.addEventListener("pointermove", onMove);
pad.addEventListener("pointerup", onUp);
pad.addEventListener("pointercancel", onUp);
// iOS Safari の拡大・スクロールを止める（pad の上だけ）
pad.addEventListener("touchstart", function (e) { e.preventDefault(); }, { passive: false });
pad.addEventListener("gesturestart", function (e) { e.preventDefault(); });

// ======================================================================
// お題と記録
// ======================================================================
var mode = "trial";
function record(gg, dur) {
  return { got: gg.result, latencyMs: gg.latency, durationMs: dur, fingers: gg.maxFingers,
    maxMovePx: Math.round(gg.maxMove),
    pinch: gg.two && gg.two.s != null ? Math.round(gg.two.s * 100) / 100 : null,
    twist: gg.two && gg.two.r != null ? Math.round(gg.two.r * 100) / 100 : null,
    margin: gg.margin, notes: gg.notes.length ? gg.notes : undefined };
}
function finish(gg, dur) {
  var rec = record(gg, dur);
  if (mode === "free") {
    rec.at = new Date().toISOString();
    state.free.unshift(rec); state.free = state.free.slice(0, 200);
    save(); renderFree(); return;
  }
  var target = state.queue[0];
  if (!target) { $("verdict").textContent = "判定: " + LABEL[rec.got] + "（お題なし）"; return; }
  rec.target = target; rec.size = state.size; rec.enabled = enabledList(); rec.th = gg.th;
  rec.at = new Date().toISOString();
  state.trials.push(rec); state.queue.shift(); save();
  var ok = rec.got === target;
  $("verdict").textContent = (ok ? "○ " : "× ") + "お題 " + LABEL[target] + " → 判定 " + LABEL[rec.got];
  $("verdict").className = ok ? "ok" : "ng";
  renderTarget(); renderResults();
}
function enabledList() { return FAMILIES.filter(function (f) { return state.enabled[f.id]; }).map(function (f) { return f.id; }); }
function buildQueue() {
  var q = [];
  FAMILIES.forEach(function (f) {
    if (!state.enabled[f.id]) return;
    f.classes.forEach(function (c) { for (var i = 0; i < state.reps; i++) q.push(c); });
  });
  for (var i = q.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = q[i]; q[i] = q[j]; q[j] = t; }
  state.queue = q; state.queueTotal = q.length; save();
}
function renderTarget() {
  var t = state.queue[0];
  var total = state.queueTotal || 0, done = total - state.queue.length;
  $("progress").style.width = total ? (done / total * 100) + "%" : "0";
  $("progressText").textContent = total ? (done + " / " + total) : "";
  if (!t) { $("target").textContent = total ? "おわり" : "―"; $("howto").textContent = total ? "下の表を見てください。「開始」でもう一度。" : "「開始」を押すと、お題がランダムに出ます。"; return; }
  $("target").textContent = LABEL[t];
  $("howto").textContent = HOWTO[familyOf(t)];
}
function renderResults() {
  var trials = state.trials;
  var classes = [];
  FAMILIES.forEach(function (f) { classes = classes.concat(f.classes); });
  var seen = {};
  trials.forEach(function (t) { seen[t.target] = 1; seen[t.got] = 1; });
  var rows = classes.filter(function (c) { return seen[c]; });
  var cols = rows.slice(); if (seen.NONE) cols.push("NONE");
  var m = {};
  trials.forEach(function (t) { var k = t.target + "|" + t.got; m[k] = (m[k] || 0) + 1; });
  var html = "<tr><th>お題＼判定</th>" + cols.map(function (c) { return "<th>" + LABEL[c] + "</th>"; }).join("") + "<th>正答率</th></tr>";
  rows.forEach(function (r) {
    var tot = 0, hit = m[r + "|" + r] || 0;
    cols.forEach(function (c) { tot += m[r + "|" + c] || 0; });
    if (!tot) return;
    html += "<tr><th>" + LABEL[r] + "</th>" + cols.map(function (c) {
      var v = m[r + "|" + c] || 0;
      var cls = c === r ? "diag" : (v ? "miss" : "");
      return "<td class='" + cls + "'>" + (v || "") + "</td>";
    }).join("") + "<td>" + Math.round(hit / tot * 100) + "%</td></tr>";
  });
  $("matrix").innerHTML = trials.length ? html : "<tr><td>まだ記録がありません</td></tr>";

  var hit = trials.filter(function (t) { return t.got === t.target; }).length;
  var lat = trials.filter(function (t) { return t.got === t.target && t.got !== "NONE"; }).map(function (t) { return t.latencyMs; }).sort(function (a, b) { return a - b; });
  var med = lat.length ? lat[Math.floor(lat.length / 2)] : null;
  $("summary").textContent = trials.length
    ? "全体 " + hit + " / " + trials.length + "（" + Math.round(hit / trials.length * 100) + "%）・正しく判定できたときの判定までの時間（中央値）" + (med != null ? med + "ms" : "―")
    : "";

  var conf = [];
  for (var k in m) { var p = k.split("|"); if (p[0] !== p[1]) conf.push({ a: p[0], b: p[1], n: m[k] }); }
  conf.sort(function (x, y) { return y.n - x.n; });
  $("confusions").innerHTML = conf.length ? conf.map(function (c) {
    return "<li>" + LABEL[c.a] + " → " + LABEL[c.b] + "： " + c.n + "回</li>";
  }).join("") : "<li style='color:var(--dim)'>なし</li>";
  renderOut();
}
function renderFree() {
  $("freeLog").innerHTML = state.free.slice(0, 30).map(function (r) {
    return "<li>" + LABEL[r.got] + " <span style='color:var(--dim)'>（" + r.fingers + "本・" + r.latencyMs + "ms・移動" + r.maxMovePx + "px）</span></li>";
  }).join("");
  renderOut();
}
function exportObj() {
  return { format: "keydeck.lab.multigesture.v1", request: "REQ-20260929-001", exportedAt: new Date().toISOString(),
    device: { ua: navigator.userAgent, viewport: innerWidth + "x" + innerHeight, dpr: devicePixelRatio,
      touchPoints: navigator.maxTouchPoints },
    trials: state.trials, free: state.free.slice(0, 50) };
}
function renderOut() { $("out").value = JSON.stringify(exportObj(), null, 1); }

function setMode(m) {
  mode = m;
  $("tabTrial").setAttribute("aria-pressed", m === "trial");
  $("tabFree").setAttribute("aria-pressed", m === "free");
  $("trialHead").classList.toggle("hide", m !== "trial");
  ["btnStart", "btnUndo", "btnSkip"].forEach(function (id) { $(id).classList.toggle("hide", m !== "trial"); });
  $("verdict").textContent = "";
}
$("tabTrial").addEventListener("click", function () { setMode("trial"); });
$("tabFree").addEventListener("click", function () { setMode("free"); });
$("btnStart").addEventListener("click", function () { buildQueue(); renderTarget(); $("verdict").textContent = ""; });
$("btnSkip").addEventListener("click", function () { state.queue.shift(); save(); renderTarget(); });
$("btnUndo").addEventListener("click", function () {
  var last = state.trials.pop();
  if (last) { state.queue.unshift(last.target); save(); renderTarget(); renderResults(); $("verdict").textContent = "取り消しました"; $("verdict").className = ""; }
});
$("btnClear").addEventListener("click", function () {
  if (!confirm("この端末に残っている記録を全部消します。よいですか？")) return;
  state.trials = []; state.free = []; state.queue = []; state.queueTotal = 0; save();
  renderTarget(); renderResults(); renderFree();
});
$("btnCopy").addEventListener("click", function () {
  var txt = $("out").value;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(function () { $("btnCopy").textContent = "コピーしました"; },
      function () { $("out").select(); document.execCommand("copy"); });
  } else { $("out").select(); document.execCommand("copy"); }
});
$("btnDownload").addEventListener("click", function () {
  var blob = new Blob([JSON.stringify(exportObj(), null, 1)], { type: "application/json" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "multigesture_" + new Date().toISOString().slice(0, 16).replace(/[:T]/g, "") + ".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
});

renderTarget(); renderResults(); renderFree();
</script>
</body>
</html>
