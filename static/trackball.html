<!DOCTYPE html>
<html lang="ja">
<!-- ============================================================
  trackball.html — トラックボール面 **Vol2（シンプル版・2026-09-22）**
  URL: /trackball?token=…   （Vol1.1 は static/trackball_v1_1.html に凍結して残してある）

  ■ Vol2 でできること（1本指だけ。2本目の指は無視する）
      動かす                    … カーソル移動
      タップ                    … 左クリック
      ダブルタップ              … ダブルクリック
      タップ → すぐ触れて置く   … 0.2秒後（または動かし始めたら）左ボタンを押しっぱなし。
                                  離すまで選択中。範囲スクショの囲みもこれで行う
      R（右端の真ん中）          … 右クリック（tap1-right）。2026-09-22 追加
      ✋つかむ（右下）           … 押すと左ボタンを押したまま（つかみ中）、もう一度押すと離す。
                                  つかみ中は球で動かすだけ（タップはクリックにしない）。
                                  指を離して持ち直しても押されたまま。範囲スクショの囲みはこれが確実
                                  （2026-09-22。タップ→押しっぱなしは間合い頼みで実機で成功しなかった）
                                  画面を閉じる/切り替える → 離す。通信が切れる → Hub が離す（release_held_keys）
  球は面いっぱい・中心に描く。設定アイコンは球の画面の右上に重ねるだけ（帯・外枠は置かない）。

  ■ Vol1.1 から抜いたもの
      右クリック（右の帯のタップ）・Ctrl+C（2本長押しのコピー）・Ctrl+V（2本タップ）・
      右の帯の2本スクロール・領域の案内表示
    Hub 側の surfaces/trackball.json は変えていない（Vol1.1 がそのまま使えるように）。
    Vol2 が送るのは tap1-left / dtap1 / tapdrag1 と surface.state だけ。

  ■ 見た目
    青い球＋十字ライン。模様の点は既定で0（設定で増やせる）。
    設定値の保存先は Vol1.1 と分けた（trackball02）。Vol1.1 の赤用の設定を引き継がない。

  （以下は Vol1.1 から引き継いだ構造の説明。Core / View / Sink の3層は変えていない）

  ■ 移植元
    （scratchpad）trackball_canvas2d.html が見た目・挙動の正（brief/keydeck_trackball_design_v0.6.md）。
    移植時の変更点は次の3点のみ:
      1. WS接続をipad.htmlと同じ規則にする: /ws?token=…&surface=trackball。
         `?ws=`クエリで手動指定する仕組みは削除した。
      2. ヘッダを他面と揃える: QRボタン(D25)・接続状態ボタン(D26)。ipad.htmlのCSS・構造を踏襲
         （値は同一）。ヘッダがflowを占める分だけ、#ball/#lower-half の基準をvh→#stage比の%へ
         変更し、⚙/パラメータパネル/State読み取りの絶対配置の親を#stageへ移した
         （ヘッダ追加に伴う構造上必要な変更のみ。数値・見た目は不変）。
      3. エラーは必ずconsole.errorに[KD][ERR][コード]書式で出す（D9。ipad.htmlのlog()を流用）。

  ■ 構造（機能分離。出口を後から付け替えるための形）
    この面は「何を操作しているか」を知らない。3層に分かれている。

      ① Core   … 回した結果を State として持つ。描画もWSも知らない
      ② View   … Coreを読んで描くだけ。Stateを書き換えない
      ③ Sink   … Stateの出口。登録した数だけ呼ばれる。付け替えはここだけ

    出口を差し替えるときに触るのは ③ だけで、①②は無変更でよい。
    「マウス」という語が ①② に一切出てこないのが分離できている証拠
    （G-13b・移植元のP-002 G-b）。

  ■ State（機器非依存の共通形。brief/keydeck_trackball_design_v0.6.md §3.2）
      { delta: {dx,dy}, spin: {x,y,z,w}, active: bool }
      delta  … 直前フレームからの相対量        → マウス向け（今回）
      spin   … 累積姿勢（クォータニオン）      → 3D角度向け（将来）
      active … 接触中か                        → パッド向け（将来）
    今回使うのは delta だけだが、spin/active も送るだけ送る（Hubは読み捨てる）。

  ■ 3Dに見せている仕組み（外部ライブラリなし。D2）
    単位球面上に等間隔（フィボナッチ配置）で点を置き、ドラッグに応じて
    3x3回転行列を左から掛けて累積する。z>0（手前側）だけを正射影で描く。
    十字ラインは手前を通る大円2本。任意軸に自由回転する＝本物のトラックボール挙動。

  ■ パラメータはJSON
    調整値は <script type="application/json" id="paramSpec"> に集約。
    UIはこのJSONから自動生成する。項目の増減はJSON編集だけでよい。

  ■ Hubへの接続（D28）
    surfaceId="tb01"（surfaces/trackball.json）でHubへStateを送る。出口(binding)は
    Hub側のJSONだけが決める。このHTMLはbindingを一切知らない・選べない。
  ============================================================ -->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>KeyDeck — トラックボール</title>
  <style>
    :root {
      color-scheme: dark;
      --bg:#101526; --panel:#1c2338; --ink:#f4f7ff; --ink-muted:#b7bfd6; --ink-dim:#4b5468;
      --line:#2d3550; --accent:#2d67d9; --hot:#ff5555; --ok:#35c47a; --err:#e2555a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100vw; height: 100vh; overflow: hidden;
      background: var(--bg); color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      -webkit-user-select: none; user-select: none;
    }
    body { display: flex; flex-direction: column; }

    /* ===== ヘッダ（D25/D26。ipad.htmlのCSS・構造を踏襲。値は不変） ===== */
    .tb-head { display: flex; align-items: center; gap: 10px; padding: 10px 14px; flex: 0 0 auto; }
    .tb-head h1 { font-size: 15px; margin: 0; font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .spacer { flex: 1; }
    #statusBtn {
      display: flex; align-items: center; gap: 6px; border: 1px solid var(--line);
      border-radius: 999px; background: var(--panel); color: var(--ink); font: inherit;
      font-size: 12px; padding: 5px 12px 5px 8px;
    }
    #statusBtn .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--ink-dim); display: inline-block; }
    #statusBtn.connected .dot { background: var(--ok); }
    #statusBtn.disconnected .dot { background: var(--err); }
    #qrOpenBtn {
      min-width: 44px; min-height: 40px; border: 0; border-radius: 8px;
      background: var(--accent); color: #fff; font: inherit; font-size: 13px; padding: 0 12px;
    }

    /* ===== ステージ =====
       Vol2: 球が面いっぱいを使い、設定アイコンは右上に**重ねる**だけ。
       帯（外枠）を置くと、その幅だけ球の描画域が狭まり、球が面の中心から左へずれる
       （実際にずれた）。 */
    #stage { position: relative; flex: 1 1 auto; min-height: 0; }

    #ball {
      position: absolute; inset: 0; width: 100%; height: 100%; display: block;
      touch-action: none; /* ドラッグ中にページがスクロールしないように */
    }

    /* ===== 設定アイコン（球の画面の右上に重ねる） =====
       ボタン自身が指を受けるので、歯車の上を触っても球は動かない。 */
    #paramToggle {
      position: absolute; top: 8px; right: 8px; z-index: 30;
      min-width: 44px; min-height: 44px;
      border: 1px solid var(--line); border-radius: 10px;
      background: var(--panel); color: var(--ink);
      font: inherit; font-size: 20px; line-height: 1;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
    }
    #paramToggle:active { background: var(--accent); }
    #paramToggle.on { background: var(--accent); border-color: var(--accent); }

    /* ===== つかむ（左ボタンを押したままにするトグル） =====
       画面の右下に重ねる（ユーザー指定）。押すたびに「つかむ ⇄ 離す」。つかんでいる間は
       ボタンを赤くし、面のふちも赤く光らせる（押されたままなのが一目で分かるように。
       気づかずに放置すると、PC側で左ボタンが押されっぱなしになる）。 */
    #grabToggle {
      position: absolute; bottom: 8px; right: 8px; z-index: 30;
      min-width: 44px; min-height: 44px; padding: 2px 4px;
      border: 1px solid var(--line); border-radius: 10px;
      background: var(--panel); color: var(--ink);
      font: inherit; font-size: 10px; line-height: 1.1;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
      cursor: pointer;
    }
    #grabToggle .ico { font-size: 18px; }

    /* ===== 右クリック（R）。右端の真ん中＝歯車（右上）と つかむ（右下）の間 ===== */
    #rclickBtn {
      position: absolute; top: 50%; right: 8px; transform: translateY(-50%); z-index: 30;
      min-width: 44px; min-height: 44px;
      border: 1px solid var(--line); border-radius: 10px;
      background: var(--panel); color: var(--ink);
      font: inherit; font-size: 18px; font-weight: 700; line-height: 1;
      display: flex; align-items: center; justify-content: center; cursor: pointer;
    }
    #rclickBtn:active { background: var(--accent); border-color: var(--accent); }
    #grabToggle.on { background: var(--err); border-color: var(--err); color: #fff; }
    #stage.grabbed { box-shadow: inset 0 0 0 3px var(--err); }
    #grabBadge {
      position: absolute; top: 8px; left: 8px; z-index: 25; pointer-events: none;
      padding: 3px 10px; border-radius: 999px; font-size: 11px;
      background: var(--err); color: #fff;
    }
    #grabBadge[hidden] { display: none; }

    /* ===== 調整パラメータ パネル ===== */
    /* 設定パネルは歯車の左隣に開く（歯車を隠さない＝もう一度押して閉じられる） */
    .ui-panel {
      position: absolute; top: 8px; right: 60px; z-index: 20;
      width: clamp(220px, 66vw, 320px);
      max-height: calc(100% - 16px); overflow-y: auto;
      background: rgba(28, 35, 56, 0.92);
      backdrop-filter: blur(8px);
      border: 1px solid var(--line); border-radius: 12px;
      padding: 12px 14px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      display: flex; flex-direction: column; gap: 10px;
    }
    .ui-panel[hidden] { display: none; }
    .panel-title {
      font-size: 12px; color: var(--ink-muted);
      letter-spacing: .04em; text-transform: uppercase;
    }
    .slider-group { display: flex; flex-direction: column; gap: 3px; }
    .slider-header { display: flex; justify-content: space-between; font-size: 13px; }
    .slider-value { font-weight: 600; color: var(--hot); font-variant-numeric: tabular-nums; }
    .slider-hint { font-size: 10px; color: #7b86a3; line-height: 1.35; }
    input[type="range"] { width: 100%; accent-color: var(--hot); cursor: pointer; }
    .panel-foot { display: flex; gap: 8px; padding-top: 2px; }
    .panel-foot button {
      flex: 1; min-height: 34px; border: 1px solid var(--line); border-radius: 8px;
      background: var(--panel); color: var(--ink); font: inherit; font-size: 12px; cursor: pointer;
    }
    .panel-foot button:active { background: var(--accent); }
    #jsonOut {
      font-family: ui-monospace, monospace; font-size: 10px; color: #8fd8a8;
      background: #0c1120; border: 1px solid var(--line); border-radius: 8px;
      padding: 8px; white-space: pre-wrap; word-break: break-all; line-height: 1.4;
    }
    #jsonOut[hidden] { display: none; }

    /* ===== State表示（出口に何が流れているか） ===== */
    /* Vol2 では出さない（シンプル版）。数値を見たいときは display を外す */
    #stateOut {
      display: none;
      position: absolute; bottom: 8px; left: 10px; z-index: 15;
      font-family: ui-monospace, monospace; font-size: 11px; color: #6ee7a0;
      line-height: 1.5;
    }
    #stateOut .sink { color: var(--ink-muted); }
    #stateOut .sink.live { color: var(--ok); }
    #stateOut .sink.bad { color: var(--err); }

    /* ===== embedモード（P-005 段階B） =====
       `?embed=1` で開かれたとき、この面を `/layout` の1区画にそのまま埋め込めるよう、
       ヘッダ・パラメータUI・下半分のプレースホルダを隠して盤面だけにする。
       ボールの描画・慣性・ジェスチャー（Core/View/Gesture）には一切触っていない。 */
    /* 区画に埋め込むとき隠すのは、見出し・状態表示・下半分の帯だけ。
       **歯車と調整パネルは残す。** ここまで隠していたため、レイアウトに置いた
       トラックボールは感度も慣性も変えられない飾りになっていた。 */
    body.embed .tb-head { display: none !important; }
    /* 区画は単独ページより狭いので、パネルの寸法をそれに合わせる */
    body.embed .ui-panel { width: clamp(180px, calc(100% - 76px), 300px); }
    body.embed #stage { height: 100%; }

    /* ===== QRモーダル（D25。ipad.htmlと同一構造・値。z-indexのみ本ページの
       既存オーバーレイ(#paramToggle:30/.ui-panel:20)より上に出るよう引き上げてある） ===== */
    #qrModal { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(4,6,14,.88); z-index: 100; }
    #qrModal.on { display: flex; }
    .qr-card { background: var(--panel); border-radius: 16px; padding: 24px; text-align: center; }
    .qr-card img { width: 300px; height: 300px; background: #fff; border-radius: 10px; display: block; margin: 0 auto; }
    .qr-close { margin-top: 16px; min-width: 120px; min-height: 44px; border: 0; border-radius: 10px; background: var(--accent); color: #fff; font: inherit; }
  </style>
</head>
<body>

  <!-- パラメータの正。ここを編集すればUIが変わる（HTML/JSは触らない） -->
  <script type="application/json" id="paramSpec">
  {

  <header class="tb-head">
    <h1 id="title">KeyDeck — トラックボール</h1>
    <span class="spacer"></span>
    <button id="statusBtn" type="button"><span class="dot" aria-hidden="true"></span><span id="statusLabel">未接続</span></button>
    <button id="qrOpenBtn" type="button">QR</button>
  </header>

  <div id="stage">
    <canvas id="ball"></canvas>
    <button id="rclickBtn" type="button" aria-label="右クリック" title="右クリック">R</button>
    <button id="grabToggle" type="button" aria-pressed="false"
            title="左ボタンを押したままにする（もう一度押すと離す）"><span class="ico">✋</span><span id="grabLabel">つかむ</span></button>
    <div id="grabBadge" hidden>つかみ中 — 球で動かすと範囲が広がる</div>
    <button id="paramToggle" type="button" class="on"
            aria-label="調整パラメータの表示切替" aria-expanded="true" title="調整パラメータ">⚙</button>

    <section class="ui-panel" id="paramPanel" aria-label="調整パラメータ">
      <div class="panel-title" id="panelTitle">調整パラメータ</div>
      <div id="fields"></div>
      <div class="panel-foot">
        <button type="button" id="resetBtn">初期値に戻す</button>
        <button type="button" id="jsonBtn">JSON表示</button>
      </div>
      <pre id="jsonOut" hidden></pre>
    </section>

    <div id="stateOut"></div>
  </div>

  <div id="qrModal">
    <div class="qr-card">
      <h2>trackball</h2>
      <img data-qr="trackball" alt="QR: trackball">
      <button class="qr-close" id="qrCloseBtn">閉じる</button>
    </div>
  </div>

  <script src="/components.js"></script>
  <script>
  (function () {
    "use strict";

    // ---- 起動時の文脈（D8: tokenはURLクエリから） --------------------------
    // P-005 段階B: `/layout` の区画に埋め込まれているときは、盤面だけを出す。
    if (new URLSearchParams(location.search).get("embed")) {
      document.body.classList.add("embed");
      // 区画では最初は球だけを見せる。調整は歯車から開く
      // （単独ページは今までどおり開いた状態で始める）。
      var embedPanel = document.getElementById("paramPanel");
      var embedToggle = document.getElementById("paramToggle");
      if (embedPanel) embedPanel.hidden = true;
      if (embedToggle) {
        embedToggle.classList.remove("on");
        embedToggle.setAttribute("aria-expanded", "false");
      }
    }

    const params = new URLSearchParams(location.search);
    const token = params.get("token") || "";
    // /api/qr は token が要る（2026-09-30）。token を読んでから QR の画像を読み込む
    document.querySelectorAll("img[data-qr]").forEach(function (im) { im.src = "/api/qr?target=" + encodeURIComponent(im.dataset.qr) + "&token=" + encodeURIComponent(token); });
    // D28: surfaces/trackball.jsonに登録済みの自分の識別子。出口(binding)はここには無い。
    const SURFACE_ID = "tb01";
    // この面は surface.config を受け取らない（keymapを持たないため）ので、
    // 開いた時にHubへテーマを聞きに行く。
    if (window.KDComponents) KDComponents.syncTheme(token);

    // D9: 全面共通のログ書式。[KD][ERR][コード] cause=… の1行（ipad.htmlのlog()を流用）。
    function log(kind, code, message, context) {
      const line = "[KD][" + kind + "][" + code + "] " + message;
      if (kind === "ERR") {
        console.error(line, context ?? "");
      } else {
        console.info(line, context ?? "");
      }
    }

    // ================================================================
    // 0. パラメータ: JSONを正としてUIを生成する
    // ================================================================
    const spec = JSON.parse(document.getElementById("paramSpec").textContent);
    const P = {};                                   // 現在値。以後ロジックはこれだけを見る
    const defaults = {};
    spec.fields.forEach(f => { P[f.id] = f.value; defaults[f.id] = f.value; });

    const STORE_KEY = "trackball_params_" + spec.id;
    try {
      const saved = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
      if (saved) Object.keys(P).forEach(k => { if (typeof saved[k] === "number") P[k] = saved[k]; });
    } catch (e) { /* 壊れた保存値は黙って捨てて初期値で続行 */ }

    document.getElementById("panelTitle").textContent = spec.title;

    const fieldsEl = document.getElementById("fields");
    const valueEls = {};
    spec.fields.forEach(f => {
      const wrap = document.createElement("div");
      wrap.className = "slider-group";
      wrap.innerHTML =
        '<div class="slider-header">' +
          '<label for="f_' + f.id + '">' + f.label + '</label>' +
          '<span class="slider-value" id="v_' + f.id + '"></span>' +
        '</div>' +
        '<input type="range" id="f_' + f.id + '" min="' + f.min + '" max="' + f.max +
          '" step="' + f.step + '" value="' + P[f.id] + '">' +
        '<div class="slider-hint">' + f.hint + '</div>';
      fieldsEl.appendChild(wrap);

      const input = wrap.querySelector("input");
      const valEl = wrap.querySelector(".slider-value");
      const decimals = (String(f.step).split(".")[1] || "").length;
      const render = () => { valEl.textContent = P[f.id].toFixed(decimals); };
      render();

      input.addEventListener("input", e => {
        P[f.id] = parseFloat(e.target.value);
        render();
        if (f.id === "dots") View.rebuildPattern();
        persist();
        refreshJson();
      });
      valueEls[f.id] = { input, render };
    });

    function persist() {
      try { localStorage.setItem(STORE_KEY, JSON.stringify(P)); } catch (e) { /* 保存不可でも操作は続行 */ }
    }

    document.getElementById("resetBtn").addEventListener("click", () => {
      Object.keys(defaults).forEach(k => {
        P[k] = defaults[k];
        valueEls[k].input.value = defaults[k];
        valueEls[k].render();
      });
      View.rebuildPattern();
      persist();
      refreshJson();
    });

    const jsonOut = document.getElementById("jsonOut");
    function refreshJson() {
      if (jsonOut.hidden) return;
      jsonOut.textContent = JSON.stringify({ id: spec.id, params: P }, null, 2);
    }
    document.getElementById("jsonBtn").addEventListener("click", () => {
      jsonOut.hidden = !jsonOut.hidden;
      refreshJson();
    });

    // ---- 面のUI状態（2値。設定中はボール操作を受け付けない） ----------
    //   settings  … 調整パネルを開いている。枠の外をタップするとtrackballへ戻る
    //   trackball … 通常のボール操作
    // 「閉じるためのタップ」がそのままカーソル移動を発火すると操作として不自然なため、
    // 枠外タップはcaptureフェーズで捕まえて閉じるだけに使い、後続へは伝えない。
    const UI_SETTINGS = "settings";
    const UI_TRACKBALL = "trackball";

    const panel = document.getElementById("paramPanel");
    const toggle = document.getElementById("paramToggle");
    let uiState = panel.hidden ? UI_TRACKBALL : UI_SETTINGS;

    function setUiState(next) {
      if (uiState === next) return;
      uiState = next;
      const showing = next === UI_SETTINGS;
      panel.hidden = !showing;
      toggle.classList.toggle("on", showing);
      toggle.setAttribute("aria-expanded", String(showing));
    }

    toggle.addEventListener("click", () => {
      setUiState(uiState === UI_SETTINGS ? UI_TRACKBALL : UI_SETTINGS);
    });

    // 枠外タップで設定を閉じる。captureフェーズなのでcanvasのpointerdownより先に走る
    document.addEventListener("pointerdown", e => {
      if (uiState !== UI_SETTINGS) return;
      // パネル自身と⚙ボタンの上は「外」ではない（⚙は自前のclickで開閉する）
      if (panel.contains(e.target) || toggle.contains(e.target)) return;
      // つかむボタンは「外」でも押せるようにする（範囲選択の途中で離したいときに、
      // パネルを閉じる1タップを挟ませない）
      if (document.getElementById("grabToggle").contains(e.target)) return;
      if (document.getElementById("rclickBtn").contains(e.target)) return;
      setUiState(UI_TRACKBALL);
      // このタップはボール操作へ渡さない（閉じるだけで終わらせる）
      e.stopPropagation();
      e.preventDefault();
    }, true);

    // ================================================================
    // 1. Core — 状態だけを持つ。描画も送信も知らない
    // ================================================================
    const Core = (function () {
      let R = [1, 0, 0, 0, 1, 0, 0, 0, 1];   // 累積姿勢（3x3・行優先）
      let velocity = { x: 0, y: 0 };          // 慣性用
      let active = false;
      const listeners = [];

      // ロドリゲスの回転公式: 単位軸まわりにangleだけ回す行列
      function axisAngle(x, y, z, angle) {
        const c = Math.cos(angle), s = Math.sin(angle), t = 1 - c;
        return [
          t*x*x + c,     t*x*y - s*z,   t*x*z + s*y,
          t*x*y + s*z,   t*y*y + c,     t*y*z - s*x,
          t*x*z - s*y,   t*y*z + s*x,   t*z*z + c
        ];
      }

      function multiply(a, b) {               // a * b（どちらも3x3）
        const m = new Array(9);
        for (let r = 0; r < 3; r++) {
          for (let col = 0; col < 3; col++) {
            m[r*3+col] = a[r*3]*b[col] + a[r*3+1]*b[3+col] + a[r*3+2]*b[6+col];
          }
        }
        return m;
      }

      // 累積姿勢をクォータニオンへ。将来の3D出口が読む値
      function toQuat() {
        const m00=R[0], m01=R[1], m02=R[2], m10=R[3], m11=R[4], m12=R[5], m20=R[6], m21=R[7], m22=R[8];
        const tr = m00 + m11 + m22;
        let x, y, z, w;
        if (tr > 0) {
          const s = Math.sqrt(tr + 1) * 2;
          w = 0.25 * s; x = (m21 - m12) / s; y = (m02 - m20) / s; z = (m10 - m01) / s;
        } else if (m00 > m11 && m00 > m22) {
          const s = Math.sqrt(1 + m00 - m11 - m22) * 2;
          w = (m21 - m12) / s; x = 0.25 * s; y = (m01 + m10) / s; z = (m02 + m20) / s;
        } else if (m11 > m22) {
          const s = Math.sqrt(1 + m11 - m00 - m22) * 2;
          w = (m02 - m20) / s; x = (m01 + m10) / s; y = 0.25 * s; z = (m12 + m21) / s;
        } else {
          const s = Math.sqrt(1 + m22 - m00 - m11) * 2;
          w = (m10 - m01) / s; x = (m02 + m20) / s; y = (m12 + m21) / s; z = 0.25 * s;
        }
        return { x: +x.toFixed(4), y: +y.toFixed(4), z: +z.toFixed(4), w: +w.toFixed(4) };
      }

      // 生の指移動量を、パラメータを通した出力量へ換算する
      function normalize(rawX, rawY) {
        const mag = Math.hypot(rawX, rawY);
        if (mag < P.deadzone) return { dx: 0, dy: 0 };
        // 加速度: 速く動かすほど倍率が上がる。1.0なら等速のまま
        const accel = P.acceleration === 1 ? 1 : Math.pow(Math.max(mag, 1), P.acceleration - 1);
        const gain = P.sensitivity * P.speed * accel;
        return { dx: rawX * gain, dy: rawY * gain };
      }

      // 出力量ぶんだけ姿勢を回す。画面基準の軸なので差分は常に左から掛ける
      function rotateBy(dx, dy) {
        const mag = Math.hypot(dx, dy);
        if (mag <= 0) return;
        R = multiply(axisAngle(dy / mag, dx / mag, 0, mag * 0.005 * P.spin), R);
      }

      function emit(delta) {
        const state = { delta: delta, spin: toQuat(), active: active };
        for (let i = 0; i < listeners.length; i++) listeners[i](state);
      }

      return {
        // Sinkの登録口。ここに足すだけで出口が増える
        onState: function (fn) { listeners.push(fn); },

        begin: function () { active = true; velocity = { x: 0, y: 0 }; },

        move: function (rawX, rawY) {
          const d = normalize(rawX, rawY);
          velocity = { x: d.dx, y: d.dy };
          rotateBy(d.dx, d.dy);
          emit(d);
          return d;                            // 生値との対比表示用
        },

        end: function () {
          active = false;
          if (P.inertia <= 0) velocity = { x: 0, y: 0 };
          else { velocity.x *= P.inertia; velocity.y *= P.inertia; }
          emit({ dx: 0, dy: 0 });              // 離した瞬間もStateとして通知する
        },

        // 慣性の1フレーム分を進める。転がっている間はStateも出続ける
        step: function () {
          if (active) return false;
          if (Math.abs(velocity.x) <= 0.01 && Math.abs(velocity.y) <= 0.01) return false;
          rotateBy(velocity.x, velocity.y);
          emit({ dx: velocity.x, dy: velocity.y });
          velocity.x *= P.friction;
          velocity.y *= P.friction;
          return true;
        },

        matrix: function () { return R; }
      };
    })();

    // ================================================================
    // 2. View — Coreを読んで描くだけ。Stateを書き換えない
    // ================================================================
    const View = (function () {
      const canvas = document.getElementById("ball");
      const ctx = canvas.getContext("2d");
      let W = 0, H = 0, cx = 0, cy = 0, radius = 0;
      let points = [];

      // ヘッダがflowを占める分、W/Hは「viewport」ではなくcanvas自身のCSSボックス
      // （#ball{width:100%;height:50%} の実測値=#stage基準）から取る。
      function resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        // **測る前に自分で書いた寸法を消す。**
        // 前回 style.width/height を入れているため、そのまま測ると
        // 前回の値がそのまま返ってきて、置き場所が広がっても球は広がらない。
        // （区画の大きさを変えても・端末を回しても、古い幅のまま残っていた）
        canvas.style.width = "";
        canvas.style.height = "";
        const rect = canvas.getBoundingClientRect();
        W = rect.width;
        H = rect.height;
        canvas.width = Math.round(W * dpr);
        canvas.height = Math.round(H * dpr);
        canvas.style.width = W + "px";
        canvas.style.height = H + "px";
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);   // 以後はCSSピクセルで描ける
        cx = W / 2; cy = H / 2;
        // Vol2 は下半分の帯が無く球が面いっぱいを使えるので、Vol1.1（0.28）より大きく描く。
        // 台座（radius×1.46）が面からはみ出さない上限が 0.34
        radius = Math.min(W, H) * 0.32;
      }

      // 単位球面へ等間隔に点を置く（フィボナッチ球）
      function rebuildPattern() {
        const n = Math.round(P.dots);
        const golden = Math.PI * (3 - Math.sqrt(5));
        points = [];
        for (let i = 0; i < n; i++) {
          const y = 1 - (i / (n - 1)) * 2;        // +1 → -1
          const r = Math.sqrt(Math.max(0, 1 - y * y));
          const th = golden * i;
          points.push([Math.cos(th) * r, y, Math.sin(th) * r]);
        }
      }

      // 球面上の大円を1本引く。a・bは直交する単位ベクトルで、円は a*cos t + b*sin t
      function drawRing(R, ax, ay, az, bx, by, bz, width) {
        const N = 96;
        ctx.lineCap = "round";
        let prev = null;
        for (let i = 0; i <= N; i++) {
          const t = (i / N) * Math.PI * 2;
          const c = Math.cos(t), s = Math.sin(t);
          const px = ax*c + bx*s, py = ay*c + by*s, pz = az*c + bz*s;
          const x = R[0]*px + R[1]*py + R[2]*pz;
          const y = R[3]*px + R[4]*py + R[5]*pz;
          const z = R[6]*px + R[7]*py + R[8]*pz;
          const cur = z > 0.02 ? { sx: cx + x * radius, sy: cy - y * radius, z: z } : null;
          if (prev && cur) {
            const depth = Math.min(prev.z, cur.z);
            ctx.beginPath();
            ctx.moveTo(prev.sx, prev.sy);
            ctx.lineTo(cur.sx, cur.sy);
            ctx.strokeStyle = "rgba(255,255,255," + (0.12 + 0.78 * depth).toFixed(3) + ")";
            ctx.lineWidth = width * (0.45 + 0.55 * depth);
            ctx.stroke();
          }
          prev = cur;
        }
      }

      function draw() {
        const R = Core.matrix();
        ctx.clearRect(0, 0, W, H);

        // 台座（球の受け皿）。楕円で斜め上から見た感じを出す
        ctx.save();
        ctx.translate(cx, cy + radius * 0.22);
        ctx.scale(1, 0.52);
        ctx.beginPath(); ctx.arc(0, 0, radius * 1.46, 0, Math.PI * 2);
        ctx.fillStyle = "#20242e"; ctx.fill();
        ctx.beginPath(); ctx.arc(0, 0, radius * 1.16, 0, Math.PI * 2);
        ctx.fillStyle = "#171a22"; ctx.fill();
        ctx.restore();

        // 球本体。左上から光が当たっているように見せる
        const grad = ctx.createRadialGradient(
          cx - radius * 0.35, cy - radius * 0.4, radius * 0.05, cx, cy, radius);
        // Vol2: 青い球（Vol1.1 は赤）
        grad.addColorStop(0, "#7fb4ff");
        grad.addColorStop(0.45, "#2d67d9");
        grad.addColorStop(1, "#0b2a6b");
        ctx.beginPath(); ctx.arc(cx, cy, radius, 0, Math.PI * 2);
        ctx.fillStyle = grad; ctx.fill();

        // 球面の点。z>0（手前側）だけを描くと転がって見える
        for (let i = 0; i < points.length; i++) {
          const p = points[i];
          const x = R[0]*p[0] + R[1]*p[1] + R[2]*p[2];
          const y = R[3]*p[0] + R[4]*p[1] + R[5]*p[2];
          const z = R[6]*p[0] + R[7]*p[1] + R[8]*p[2];
          if (z <= 0.06) continue;               // 裏側と輪郭ぎりぎりは描かない
          const dotR = radius * 0.045 * z;       // 端ほど小さく＝球面に貼り付いて見える
          if (dotR < 0.3) continue;
          ctx.beginPath();
          ctx.arc(cx + x * radius, cy - y * radius, dotR, 0, Math.PI * 2);
          ctx.fillStyle = "rgba(255,255,255," + (0.25 + 0.65 * z).toFixed(3) + ")";
          ctx.fill();
        }

        // 球面に沿った十字ライン。手前を通る2つの大円が前面で直交する
        if (P.guide > 0) {
          const lw = radius * 0.012 * P.guide;
          drawRing(R, 1, 0, 0,  0, 0, 1, lw);   // 横向きの輪（XZ平面）
          drawRing(R, 0, 1, 0,  0, 0, 1, lw);   // 縦向きの輪（YZ平面）
        }

        // 光沢とふちの締め
        const gloss = ctx.createRadialGradient(
          cx - radius * 0.38, cy - radius * 0.42, 0,
          cx - radius * 0.38, cy - radius * 0.42, radius * 0.55);
        gloss.addColorStop(0, "rgba(255,255,255,0.5)");
        gloss.addColorStop(1, "rgba(255,255,255,0)");
        ctx.beginPath(); ctx.arc(cx, cy, radius, 0, Math.PI * 2);
        ctx.fillStyle = gloss; ctx.fill();

        ctx.beginPath(); ctx.arc(cx, cy, radius, 0, Math.PI * 2);
        ctx.strokeStyle = "rgba(0,0,0,0.45)"; ctx.lineWidth = 2; ctx.stroke();
      }

      resize();
      rebuildPattern();
      window.addEventListener("resize", resize);

      return { canvas: canvas, draw: draw, rebuildPattern: rebuildPattern };
    })();

    // ================================================================
    // 3. Sink — Stateの出口。付け替えるときに触るのはここだけ
    // ================================================================

    // 出口A: 画面に出るだけの確認用。実機で数値を見るために常に入れておく
    const readoutSink = (function () {
      const el = document.getElementById("stateOut");
      let raw = { dx: 0, dy: 0 };
      // 初期値を入れておく。接続状態はドラッグ前から見えている必要がある
      let last = { delta: { dx: 0, dy: 0 }, spin: { x: 0, y: 0, z: 0, w: 1 }, active: false };
      function setRaw(x, y) { raw = { dx: x, dy: y }; }
      function render() {
        el.innerHTML =
          "raw   dx: " + raw.dx.toFixed(1) + " / dy: " + raw.dy.toFixed(1) + "<br>" +
          "state dx: " + last.delta.dx.toFixed(1) + " / dy: " + last.delta.dy.toFixed(1) +
          "  active: " + last.active + "<br>" +
          "spin  x:" + last.spin.x + " y:" + last.spin.y +
          " z:" + last.spin.z + " w:" + last.spin.w + "<br>" +
          hubSink.statusHtml();
      }
      return {
        setRaw: setRaw,
        sink: function (state) { last = state; render(); },
        refresh: render
      };
    })();

    // 出口B: Hubへ送る（D28）。面は「マウス」を知らない。送るのはsurfaceIdと
    // 正規化されたStateだけで、何に繋がるかはHub側のJSON(binding)が決める。
    // WS接続の規則はipad.htmlと同じ: /ws?token=…&surface=trackball（変更点1）。
    const hubSink = (function () {
      let socket = null;
      let status = "未接続";
      let cls = "";
      let sent = 0;
      let dropped = 0;
      let reconnectTimer = null;
      let closeHandler = null;
      let lastSendAt = 0;
      const MIN_INTERVAL = 8;      // 125Hz相当。これより速い分は捨てる
      const CLAMP = 200;           // surfaces/trackball.jsonのclampと同じ既定値（クライアント側の先読みクランプ）

      function setConnectionBadge(connected) {
        const btn = document.getElementById("statusBtn");
        const label = document.getElementById("statusLabel");
        btn.classList.toggle("connected", connected);
        btn.classList.toggle("disconnected", !connected);
        label.textContent = connected ? "接続中" : "切断・タップで再接続";
      }

      function connect() {
        if (socket && (socket.readyState === WebSocket.OPEN || socket.readyState === WebSocket.CONNECTING)) {
          return;
        }
        // 注意: ここは hubSink 自身のIIFE実行中（bottom の connect() 初回呼び出し）にも通るため、
        // readoutSink.refresh()（内部でhubSink.statusHtml()を参照する）をここで同期的に呼ぶと
        // hubSinkがまだ初期化完了前でTDZ例外になる。状態文字列の更新のみに留め、実際の再描画は
        // 呼び出し元（outer IIFE末尾のreadoutSink.refresh()、またはopen/close等の非同期イベント）に任せる。
        status = "接続中…"; cls = "";
        socket = new WebSocket(
          (location.protocol === "https:" ? "wss" : "ws") + "://" + location.host +
            "/ws?surface=trackball&token=" + encodeURIComponent(token)
        );

        socket.addEventListener("open", () => {
          status = "接続済み"; cls = "live";
          log("T13", "OK", "ws open (surface=trackball)");
          setConnectionBadge(true);
          readoutSink.refresh();
        });

        socket.addEventListener("message", (event) => {
          let data;
          try {
            data = JSON.parse(event.data);
          } catch (error) {
            log("ERR", "INTERNAL", "failed to parse server message: " + error, event.data);
            return;
          }
          if (data.type === "error") {
            log("ERR", data.code, "cause: " + data.cause, data.context);
          } else {
            // トラックボール面はsurface.config/layer.stateの受信対象外（本Volはマウス出口のみ）。
            log("T13", "OK", "unhandled server message type: " + data.type, data);
          }
        });

        socket.addEventListener("close", () => {
          status = "切断"; cls = "bad";
          log("ERR", "WS_CLOSE", "disconnected; retrying");
          // 切れた時点で Hub が押しっぱなしのボタンを離している（release_held_keys）。
          // 画面側の「つかみ中」も解いて、表示とPCの状態を食い違わせない
          if (closeHandler) closeHandler();
          setConnectionBadge(false);
          readoutSink.refresh();
          scheduleReconnect();
        });

        socket.addEventListener("error", () => {
          // closeイベントが後続するため、ここではログのみ（二重の再接続予約はしない）。
          log("ERR", "WS_ERROR", "websocket error event");
        });
      }

      function scheduleReconnect() {
        if (reconnectTimer) return;
        reconnectTimer = setTimeout(() => {
          reconnectTimer = null;
          connect();
        }, 2000);
      }

      function clamp(v) { return Math.max(-CLAMP, Math.min(CLAMP, Math.round(v))); }


      // D26: 状態ボタンをタップすると即時再接続を試みる（すでに接続中なら何もしない）。
      document.getElementById("statusBtn").addEventListener("click", () => {
        if (!socket || socket.readyState === WebSocket.CLOSED || socket.readyState === WebSocket.CLOSING) {
          log("T13", "OK", "manual reconnect requested via status button");
          connect();
        }
      });

      // D25: QRボタン→中央モーダルに自ページのQR。閉じるで戻る（1画面1QR）。
      document.getElementById("qrOpenBtn").addEventListener("click", () => {
        document.getElementById("qrModal").classList.add("on");
      });
      document.getElementById("qrCloseBtn").addEventListener("click", () => {
        document.getElementById("qrModal").classList.remove("on");
      });

      connect();

      return {
        sink: function (state) {
          if (!socket || socket.readyState !== WebSocket.OPEN) return;
          const now = performance.now();
          if (now - lastSendAt < MIN_INTERVAL) { dropped++; return; }
          lastSendAt = now;
          socket.send(JSON.stringify({
            type: "surface.state",
            surfaceId: SURFACE_ID,
            delta: { dx: clamp(state.delta.dx), dy: clamp(state.delta.dy) },
            spin: state.spin,
            active: state.active
          }));
          sent++;
        },
        // T19（brief/keydeck_trackball_gestures_v0.7.md §2.1）: discreteジェスチャー送信。
        // gestureIdが何をするか（ボタン・キー）はこのHTMLに一切書かない
        // （surfaces/trackball.jsonのgesturesマップだけが意味を持つ。D5と同じ形）。
        sendGesture: function (gestureId, edge) {
          if (!socket || socket.readyState !== WebSocket.OPEN) return;
          const msg = { type: "surface.gesture", surfaceId: SURFACE_ID, gestureId: gestureId };
          if (edge) msg.edge = edge;
          socket.send(JSON.stringify(msg));
          log("T19", "OK", "surface.gesture sent", msg);
        },
        /// 切断したときに呼ぶ処理を1つ登録する（つかみ中の表示を解くため）
        onClose: function (fn) { closeHandler = fn; },
        statusHtml: function () {
          return '<span class="sink ' + cls + '">sink: ' + status +
                 ' / 送信 ' + sent + ' 件・間引き ' + dropped + ' 件</span>';
        }
      };
    })();

    // ---- 出口の登録。増やしたいときはここに1行足すだけ ----
    Core.onState(readoutSink.sink);
    Core.onState(hubSink.sink);

    // ================================================================
    // 4. Gesture（Vol2）— 1本指だけを見る。2本目以降の指は無視する。
    //    状態は4つだけ:
    //      idle      … 触れていない
    //      move      … 1本指でカーソルを動かしている
    //      candidate … タップ直後に2回目が触れた。まだ決めていない
    //                  （すぐ離せばダブルクリック、置いたまま/動かせば押しっぱなし）
    //      hold      … 左ボタンを押している（離すまで選択中）
    //    何を押すかは surfaces/trackball.json の gestures が決める。ここは名前を送るだけ。
    // ================================================================
    const Gesture = (function () {
      const T_TAP_MAX = 250;       // ms: down→up がこれ以内で、動いていなければタップ
      const T_DTAP_MAX = 300;      // ms: 1回目のタップからこれ以内に触れれば「2回目」
      const T_TAPDRAG_HOLD = 200;  // ms: 2回目をこれだけ置いたら押しっぱなし
      const MOVE_THRESHOLD = 10;   // px: これを超えて動いたら「タップではない」

      let finger = null;           // 追っている1本 { id, startX, startY, lastX, lastY, downAt, moved, tainted }
      let mode = "idle";
      let holdTimer = null;
      let buf = { x: 0, y: 0 };    // candidate の間に溜めた動き。押した後に流す
      let pendingTapTimer = null;  // 1回目のタップを「ダブルか？」と待つ間のタイマー
      let awaitingSecondTap = false;
      /// 「つかむ」で左ボタンを押している間 true。この間は**動かすだけ**にする
      /// （タップ・ダブルタップ・タップ→押しっぱなしを出さない。押したままクリックが
      /// 飛ぶと、範囲選択の途中で確定・解除されてしまう）
      let grabbed = false;

      function cancelPendingTap() {
        if (pendingTapTimer) { clearTimeout(pendingTapTimer); pendingTapTimer = null; }
        awaitingSecondTap = false;
      }

      function clearHoldTimer() {
        if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
      }

      /// 押しっぱなしにする。**押してから**溜めた動きを流す（先に流すと囲み始めがずれる）
      function startHold() {
        if (mode !== "candidate") return;
        clearHoldTimer();
        mode = "hold";
        awaitingSecondTap = false;
        Core.begin();
        hubSink.sendGesture("tapdrag1", "down");
        if (buf.x || buf.y) Core.move(buf.x, buf.y);
      }

      /// いまの操作を終わらせる。押していればボタンを離す
      function finish() {
        clearHoldTimer();
        if (mode === "hold") hubSink.sendGesture("tapdrag1", "up");
        if (mode === "move" || mode === "hold") Core.end();
        mode = "idle";
      }

      function onPointerDown(e) {
        View.canvas.setPointerCapture(e.pointerId);
        if (finger) {
          // 2本目以降は操作に使わない。ただしタップの判定からは外す
          // （2本で叩いたものをクリックとして送らない）
          finger.tainted = true;
          return;
        }
        finger = {
          id: e.pointerId, startX: e.clientX, startY: e.clientY,
          lastX: e.clientX, lastY: e.clientY, downAt: performance.now(),
          moved: false, tainted: false,
        };
        if (grabbed) {
          mode = "move";      // つかみ中は、触れたら動かすだけ
          Core.begin();
        } else if (awaitingSecondTap) {
          // 1回目のクリックはまだ送らない（ダブルクリックか押しっぱなしになるかもしれない）
          if (pendingTapTimer) { clearTimeout(pendingTapTimer); pendingTapTimer = null; }
          mode = "candidate";
          buf = { x: 0, y: 0 };
          holdTimer = setTimeout(startHold, T_TAPDRAG_HOLD);
        } else {
          mode = "move";
          Core.begin();
        }
      }

      function onPointerMove(e) {
        if (!finger || e.pointerId !== finger.id) return;
        const dx = e.clientX - finger.lastX;
        const dy = e.clientY - finger.lastY;
        finger.lastX = e.clientX; finger.lastY = e.clientY;
        if (!finger.moved &&
            Math.hypot(e.clientX - finger.startX, e.clientY - finger.startY) >= MOVE_THRESHOLD) {
          finger.moved = true;
        }
        if (mode === "candidate") {
          buf.x += dx; buf.y += dy;
          if (finger.moved) startHold();   // 動かし始めたら待たずに押す
          return;
        }
        if (mode === "move" || mode === "hold") {
          readoutSink.setRaw(dx, dy);
          Core.move(dx, dy);
        }
      }

      function onPointerUp(e, cancelled) {
        try { View.canvas.releasePointerCapture(e.pointerId); } catch (err) { /* 既に解放済み */ }
        if (!finger || e.pointerId !== finger.id) return;   // 2本目以降の指
        const wasTap = !cancelled && !finger.moved && !finger.tainted &&
          performance.now() - finger.downAt <= T_TAP_MAX;
        const was = mode;
        finish();
        finger = null;

        if (grabbed) return;   // つかみ中はタップを数えない
        if (was === "hold" || !wasTap) { awaitingSecondTap = false; return; }
        if (was === "candidate") {
          // 2回目をすぐ離した＝ダブルクリック
          awaitingSecondTap = false;
          hubSink.sendGesture("dtap1");
          return;
        }
        // 1回目のタップ。ダブルタップ／押しっぱなしにならないと分かってからクリックを送る
        awaitingSecondTap = true;
        pendingTapTimer = setTimeout(() => {
          pendingTapTimer = null;
          awaitingSecondTap = false;
          hubSink.sendGesture("tap1-left");
        }, T_DTAP_MAX);
      }

      /// つかむ／離す。on=true で左ボタンを押す、false で離す。
      /// sendUp=false は「Hub がもう離した（切断）」ときで、画面の状態だけを戻す。
      function setGrabbed(on, sendUp = true) {
        if (on === grabbed) return;
        cancelPendingTap();
        // タップ→押しっぱなしの途中なら、それを先に終わらせる（押す操作が二重にならない）
        if (mode === "hold" || mode === "candidate") finish();
        grabbed = on;
        if (on) hubSink.sendGesture("grab1", "down");
        else if (sendUp) hubSink.sendGesture("grab1", "up");
      }

      return {
        onPointerDown,
        onPointerMove,
        onPointerUp: (e) => onPointerUp(e, false),
        onPointerCancel: (e) => onPointerUp(e, true),
        setGrabbed,
        isGrabbed: () => grabbed,
      };
    })();

    // ---- 右クリック（R） --------------------------------------------------
    // 押した瞬間に右クリックを1回。何を押すかは surfaces/trackball.json の tap1-right が決める
    // （Vol1.1 の「右の帯のタップ」と同じジェスチャー名を使う。Hub の設定は変えない）。
    document.getElementById("rclickBtn").addEventListener("click", () => {
      hubSink.sendGesture("tap1-right");
    });

    // ---- つかむボタン ------------------------------------------------------
    // 1回押すと左ボタンを押したまま（つかみ中）、もう一度押すと離す。
    // 指を球から離して持ち直しても、ボタンは押されたまま＝範囲選択が続く。
    const grabBtn = document.getElementById("grabToggle");
    function renderGrab() {
      const on = Gesture.isGrabbed();
      grabBtn.classList.toggle("on", on);
      grabBtn.setAttribute("aria-pressed", String(on));
      document.getElementById("grabLabel").textContent = on ? "離す" : "つかむ";
      document.getElementById("grabBadge").hidden = !on;
      document.getElementById("stage").classList.toggle("grabbed", on);
    }
    grabBtn.addEventListener("click", () => {
      Gesture.setGrabbed(!Gesture.isGrabbed());
      renderGrab();
    });
    // 通信が切れたら Hub が離している。表示だけ戻す（離す合図は送れないので送らない）
    hubSink.onClose(() => { Gesture.setGrabbed(false, false); renderGrab(); });
    // 画面を閉じる・別のアプリへ切り替える・区画が消えるときは、つかんだままにしない。
    // pagehide で送れなかった場合も、そのあと接続が切れた時点で Hub が離す
    function releaseOnLeave() {
      if (!Gesture.isGrabbed()) return;
      Gesture.setGrabbed(false);
      renderGrab();
    }
    window.addEventListener("pagehide", releaseOnLeave);
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "hidden") releaseOnLeave();
    });

    View.canvas.addEventListener("pointerdown", e => Gesture.onPointerDown(e));
    View.canvas.addEventListener("pointermove", e => Gesture.onPointerMove(e));
    View.canvas.addEventListener("pointerup", e => Gesture.onPointerUp(e));
    View.canvas.addEventListener("pointercancel", e => Gesture.onPointerCancel(e));

    function frame() {
      requestAnimationFrame(frame);
      Core.step();          // 慣性が残っていればStateが出続ける
      View.draw();
    }
    frame();
    readoutSink.refresh();

    // ---- 例外の取りこぼし防止（D9） ----------------------------------
    window.addEventListener("error", (event) => {
      log("ERR", "INTERNAL", "uncaught exception: " + event.message, event.error);
    });
    window.addEventListener("unhandledrejection", (event) => {
      log("ERR", "INTERNAL", "unhandled promise rejection: " + event.reason, event.reason);
    });
  })();
  </script>
</body>
</html>
