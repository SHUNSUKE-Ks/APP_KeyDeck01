<!DOCTYPE html>
<html lang="ja">
<!-- deck.html — Stream Deck面（T4）。素のHTML+JSのみ（D2）。設計書D6/D9/D11、
     brief/keydeck_design_v0.2.md 参照。URL: /deck?token=… -->
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>KeyDeck — Deck</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #101526;
      color: #f4f7ff;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
      display: flex;
      flex-direction: column;
      min-height: 100%;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      gap: 10px;
    }
    header h1 { font-size: 15px; margin: 0; font-weight: 600; }
    #dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #586174;
      display: inline-block;
    }
    #dot.connected { background: #35c47a; }
    main {
      flex: 1;
      display: grid;
      gap: 8px;
      padding: 12px;
      align-content: start;
      /* スロットが正方形になった分、横幅いっぱいに広げると1枚が巨大になる。
         上限を置いて中央寄せする（配置の正: brief/mockup/screen_mock_streamdeck_v0.8.html ②） */
      width: 100%;
      max-width: 620px;
      margin: 0 auto;
    }
    /* P-003 Ver1-a（ユーザー裁定「表示側は四角いスロット」）: 常に正方形にする。
       列数・行数はdecks/deck_*.jsonのgridがそのまま正なので、cols を変えても崩れない。 */
    .slot {
      aspect-ratio: 1 / 1;
      width: 100%;
      min-width: 0;
      border: 1px solid #2d3550;
      border-radius: 12px;
      background: #1c2338;
      color: #f4f7ff;
      font: inherit;
      font-size: 13px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      text-align: center;
      padding: 4px;
      overflow: hidden;
    }
    .slot:active { background: #2d67d9; border-color: #2d67d9; }
    .slot > span { font-size: 11px; line-height: 1.15; color: #b7bfd6; overflow: hidden; }
    .slot:active > span { color: #fff; }
    .slot[data-empty="true"] { background: #161c30; border-style: dashed; border-color: #232b48; color: #4b5468; }
    .slot[data-empty="true"] > span { color: #4b5468; }
    .slot[data-empty="true"]:active { background: #161c30; }
    .slot img { max-width: 28px; max-height: 28px; display: block; }
    /* P-005 段階A: render="list"（コピペリスト）。正方形をやめ横いっぱいの行にする。 */
    main.render-list { grid-template-columns: 1fr !important; max-width: 520px; gap: 6px; }
    main.render-list .slot {
      aspect-ratio: auto;
      min-height: 46px;
      flex-direction: row;
      justify-content: flex-start;
      gap: 10px;
      padding: 8px 12px;
      text-align: left;
    }
    main.render-list .slot > span { font-size: 14px; color: #f4f7ff; flex: 1 1 auto; min-width: 0;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    footer[role="status"] {
      padding: 10px 14px;
      font-size: 13px;
      color: #b7bfd6;
      min-height: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    footer.error { color: #ff8a8a; }
    #exportLink { color: #7aa2ff; font-size: 12px; text-decoration: none; }
  </style>
</head>
<body>
  <header>
    <h1 id="title">KeyDeck — Deck</h1>
    <span id="dot" aria-hidden="true"></span>
  </header>
  <main id="grid" aria-label="deck"></main>
  <footer role="status">
    <span id="status">接続していません</span>
    <a id="exportLink" href="#">Export JSON</a>
  </footer>
  <script>
    const params = new URLSearchParams(location.search);
    const token = params.get("token") || "";
    // P-005 段階A: どのDeckを描くか（省略時はdefault）。
    const deckId = params.get("deck") || "default";

    const statusEl = document.getElementById("status");
    const dotEl = document.getElementById("dot");
    const gridEl = document.getElementById("grid");
    const exportLinkEl = document.getElementById("exportLink");
    exportLinkEl.href = "/api/deck/export?deck=" + encodeURIComponent(deckId) +
      "&token=" + encodeURIComponent(token);

    let socket = null;
    let reconnectTimer = null;

    function log(kind, code, message, context) {
      const line = "[KD][" + kind + "][" + code + "] " + message;
      if (kind === "ERR") {
        console.error(line, context ?? "");
      } else {
        console.info(line, context ?? "");
      }
    }

    // P-005: 一度「tokenが古い」と分かったら、その警告を貼り付ける。
    // これが無いと、2秒ごとの再接続が「接続中…」→「切断中…」で警告を上書きし続け、
    // ユーザーは原因を知らされないまま待つことになる（実際にそうなっていた）。
    let stickyStatus = false;
    function setStatus(text, isError) {
      if (stickyStatus && !isError) return;
      statusEl.textContent = text;
      statusEl.classList.toggle("error", !!isError);
    }

    function render(deck) {
      // minmax(0,1fr): 1frは内容の最小幅を下回れないため、狭いWebViewで右端が
      // 見切れる（STATE.md「落とし穴」/ ipad.htmlと同じ修正）。
      gridEl.classList.toggle("render-list", deck.render === "list");
      gridEl.style.gridTemplateColumns = "repeat(" + deck.grid.cols + ", minmax(0, 1fr))";
      gridEl.innerHTML = "";
      const page = deck.pages[0];
      for (const slot of page.slots) {
        const btn = document.createElement("button");
        btn.className = "slot";
        const isEmpty = slot.action.t === "none";
        if (isEmpty) btn.dataset.empty = "true";
        if (slot.icon) {
          const img = document.createElement("img");
          img.src = slot.icon;
          img.alt = "";
          btn.appendChild(img);
        }
        const label = document.createElement("span");
        label.textContent = slot.label;
        btn.appendChild(label);
        btn.disabled = isEmpty;
        btn.addEventListener("pointerdown", (event) => {
          event.preventDefault();
          sendPress(slot.slotId);
        });
        gridEl.appendChild(btn);
      }
    }

    function setSlotsEnabled(enabled) {
      for (const btn of gridEl.querySelectorAll(".slot")) {
        if (btn.dataset.empty === "true") continue;
        btn.disabled = !enabled;
      }
    }

    function sendPress(slotId) {
      if (!socket || socket.readyState !== WebSocket.OPEN) {
        log("ERR", "WS_SEND_CLOSED", "socket not open; deck.press dropped", { slotId });
        return;
      }
      const message = { type: "deck.press", deckId, slotId };
      socket.send(JSON.stringify(message));
      log("T4-2", "OK", "send deck.press", message);
      setStatus(slotId + " を送信しました");
    }

    function connect() {
      setStatus("接続中…");
      socket = new WebSocket(
        (location.protocol === "https:" ? "wss" : "ws") + "://" + location.host + "/ws?token=" + encodeURIComponent(token)
      );

      socket.addEventListener("open", () => {
        log("T4-1", "OK", "ws open");
        dotEl.classList.add("connected");
        setStatus("接続しました");
      });

      socket.addEventListener("message", (event) => {
        let data;
        try {
          data = JSON.parse(event.data);
        } catch (error) {
          log("ERR", "INTERNAL", "failed to parse server message: " + error, event.data);
          return;
        }
        handleServerMessage(data);
      });

      socket.addEventListener("close", () => {
        dotEl.classList.remove("connected");
        setSlotsEnabled(false);
        setStatus("切断中は操作できません。再接続中…");
        log("ERR", "WS_CLOSE", "disconnected; retrying");
        diagnoseDisconnect();
        scheduleReconnect();
      });

      socket.addEventListener("error", () => {
        log("ERR", "WS_ERROR", "websocket error event");
      });
    }

    // ---- P-005: 「切れている」のか「tokenが古い」のかを見分けて伝える ----
    // Hubを再起動するとtokenが変わる（D8）。端末が古いURLを掴んだままだと、
    // WSは延々と拒否され続けるのに画面は「再接続中…」としか言わないため、
    // 何が悪いのか分からないまま何分も待つことになる（実際に起きた）。
    // WSが閉じたら /api/ping を叩き、401ならtokenが古いと断定して案内する。
    let staleTokenNotified = false;
    async function diagnoseDisconnect() {
      if (staleTokenNotified) return;
      try {
        const res = await fetch("/api/ping?token=" + encodeURIComponent(token), { cache: "no-store" });
        if (res.status === 401) {
          staleTokenNotified = true;
          stickyStatus = true;
          setStatus("このURLのtokenは古くなっています。PCのHub画面（ http://<PCのIP>:8770/ ）を開き直して、QRを読み直してください。", true);
          if (typeof statusLabelEl !== "undefined" && statusLabelEl) {
            statusLabelEl.textContent = "tokenが古い";
          }
          log("ERR", "WS_TOKEN_INVALID", "stale token; the Hub was restarted after this page was opened");
        }
      } catch (error) {
        // Hub自体が落ちている場合はここに来る。従来どおり再接続を待つ。
        log("T4-1", "OK", "hub unreachable while diagnosing: " + error);
      }
    }

    function scheduleReconnect() {
      if (reconnectTimer) return;
      reconnectTimer = setTimeout(() => {
        reconnectTimer = null;
        connect();
      }, 2000);
    }

    function handleServerMessage(data) {
      switch (data.type) {
        case "surface.config": {
          const deck = data.decks[deckId];
          if (!deck) {
            log("ERR", "DECK_UNKNOWN_ID", "surface.config has no deck named '" + deckId + "'",
                Object.keys(data.decks));
            setStatus("Deck '" + deckId + "' が見つかりません", true);
            break;
          }
          log("T4-1", "OK", "surface.config received", { deckId, available: Object.keys(data.decks) });
          document.getElementById("title").textContent = "KeyDeck — Deck (" + deckId + ")";
          render(deck);
          setSlotsEnabled(true);
          break;
        }
        case "layer.state":
          // Deck面はレイヤー表示を持たない（kb.html側の責務）。無視してよい。
          break;
        case "error":
          log("ERR", data.code, "cause: " + data.cause, data.context);
          setStatus("エラー: " + data.code, true);
          break;
        default:
          log("ERR", "INTERNAL", "unknown message type from server: " + data.type, data);
      }
    }

    window.addEventListener("error", (event) => {
      log("ERR", "INTERNAL", "uncaught exception: " + event.message, event.error);
    });
    window.addEventListener("unhandledrejection", (event) => {
      log("ERR", "INTERNAL", "unhandled promise rejection: " + event.reason, event.reason);
    });

    connect();
  </script>
</body>
</html>
